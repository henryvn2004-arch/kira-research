<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>研究库 — KIRA Research</title>
  <meta name="description" content="覆盖东南亚11个国家和38个行业的市场情报报告，由资深分析师撰写。" />

  <!-- hreflang -->
  <link rel="alternate" hreflang="en" href="https://kiraresearch.com/en/library" />
  <link rel="alternate" hreflang="ja" href="https://kiraresearch.com/ja/library" />
  <link rel="alternate" hreflang="ko" href="https://kiraresearch.com/ko/library" />
  <link rel="alternate" hreflang="zh-Hans" href="https://kiraresearch.com/zh/library" />
  <link rel="alternate" hreflang="x-default" href="https://kiraresearch.com/en/library" />
  <link rel="canonical" href="https://kiraresearch.com/zh/library" />

  <!-- Open Graph -->
  <meta property="og:title" content="研究库 — KIRA Research" />
  <meta property="og:description" content="东南亚市场情报研究库。11个国家，38个行业。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kiraresearch.com/zh/library" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="/css/kira.css" />
</head>
<body>

  <!-- nav + footer injected by /js/nav.js -->

  <div class="container">
    <header class="lib-header">
      <div class="hero-eyebrow" data-i18n="library.eyebrow">研究库</div>
      <h1 data-i18n="library.title">东南亚，逐个市场深入研究。</h1>
      <p data-i18n="library.sub">浏览覆盖11个国家和38个行业的市场情报报告。由资深分析师撰写，持续更新。</p>
    </header>

    <div class="lib-controls">
      <input type="text" class="lib-search" id="lib-search"
             placeholder="搜索报告：行业、国家、关键词…"
             aria-label="搜索报告"
             data-i18n-attr="placeholder:library.searchPlaceholder;aria-label:library.searchAria" />
      <span class="lib-count" id="lib-count">128份报告</span>
      <select class="lib-sort" id="lib-sort"
              aria-label="报告排序"
              data-i18n-attr="aria-label:library.sortAria">
        <option value="recent" data-i18n="library.sortRecent">最新发布</option>
        <option value="popular" data-i18n="library.sortPopular">最受欢迎</option>
        <option value="price-asc" data-i18n="library.sortPriceAsc">价格：由低到高</option>
        <option value="price-desc" data-i18n="library.sortPriceDesc">价格：由高到低</option>
      </select>
    </div>

    <div class="lib-grid">
      <aside class="filters">
        <div class="filter-group">
          <h2 data-i18n="library.filterCountry">国家</h2>
          <div class="filter-option active" data-filter="country" data-value=""><span data-i18n="library.all">全部</span><span class="count">128</span></div>
          <div class="filter-option" data-filter="country" data-value="vietnam"><span>越南</span><span class="count">28</span></div>
          <div class="filter-option" data-filter="country" data-value="indonesia"><span>印度尼西亚</span><span class="count">26</span></div>
          <div class="filter-option" data-filter="country" data-value="thailand"><span>泰国</span><span class="count">22</span></div>
          <div class="filter-option" data-filter="country" data-value="philippines"><span>菲律宾</span><span class="count">19</span></div>
          <div class="filter-option" data-filter="country" data-value="malaysia"><span>马来西亚</span><span class="count">15</span></div>
          <div class="filter-option" data-filter="country" data-value="singapore"><span>新加坡</span><span class="count">12</span></div>
        </div>

        <div class="filter-group">
          <h2 data-i18n="library.filterIndustry">行业</h2>
          <div class="filter-option" data-filter="industry" data-value="fintech"><span>金融科技</span><span class="count">14</span></div>
          <div class="filter-option" data-filter="industry" data-value="fmcg"><span>快消品</span><span class="count">22</span></div>
          <div class="filter-option" data-filter="industry" data-value="logistics"><span>物流</span><span class="count">8</span></div>
          <div class="filter-option" data-filter="industry" data-value="healthtech"><span>医疗科技</span><span class="count">11</span></div>
          <div class="filter-option" data-filter="industry" data-value="real-estate"><span>房地产</span><span class="count">6</span></div>
          <div class="filter-option" data-filter="industry" data-value="fnb"><span>餐饮食品</span><span class="count">16</span></div>
        </div>

        <div class="filter-group">
          <h2 data-i18n="library.filterYear">年份</h2>
          <div class="filter-option active" data-filter="year" data-value="2026"><span>2026</span><span class="count">94</span></div>
          <div class="filter-option" data-filter="year" data-value="2025"><span>2025</span><span class="count">34</span></div>
        </div>

        <div class="filter-group">
          <h2 data-i18n="library.filterPrice">价格</h2>
          <div class="filter-option" data-filter="price" data-value="lt30"><span data-i18n="library.priceLt30">30美元以下</span><span class="count">42</span></div>
          <div class="filter-option" data-filter="price" data-value="30-49"><span>$30 – $49</span><span class="count">68</span></div>
          <div class="filter-option" data-filter="price" data-value="gt50"><span data-i18n="library.priceGt50">$50以上</span><span class="count">18</span></div>
        </div>
      </aside>

      <div class="lib-results" id="lib-results">
        <div class="lib-empty">正在加载研究库…</div>
      </div>
    </div>
  </div>

  <script src="/js/nav.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/live-counts.js" defer></script>
  <script defer>
    // ── Library page: filter UI + dynamic fetch ──────────────
    document.addEventListener('DOMContentLoaded', () => {
      const root      = document.getElementById('lib-results');
      const countEl   = document.getElementById('lib-count');
      const searchEl  = document.getElementById('lib-search');
      const sortEl    = document.getElementById('lib-sort');
      const filterEls = document.querySelectorAll('.filter-option');
      const locale    = (window.kira && window.kira.locale) || 'zh';

      // Active filter state — one value per group (clicking re-selects).
      const state = { country: '', industry: '', year: '', price: '', q: '', sort: 'recent' };

      // ── Pre-populate from URL (?country=foo&industry=bar) ──
      const initParams = new URLSearchParams(window.location.search);
      ['country','industry','year'].forEach(k => {
        const v = initParams.get(k);
        if (v) {
          state[k] = v.toLowerCase();
          // Reflect into sidebar UI
          document.querySelectorAll(`[data-filter="${k}"]`).forEach(el => {
            el.classList.toggle('active', el.dataset.value.toLowerCase() === state[k]);
          });
        }
      });

      // ── Filter chip clicks ──
      filterEls.forEach(opt => {
        opt.addEventListener('click', () => {
          const group = opt.dataset.filter;
          const value = (opt.dataset.value || '').toLowerCase();
          // Mutual-exclusive within a group
          document.querySelectorAll(`[data-filter="${group}"]`).forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          state[group] = value;
          fetchAndRender();
        });
      });

      // ── Search + sort ──
      let searchTimer = null;
      if (searchEl) {
        searchEl.addEventListener('input', () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            state.q = searchEl.value.trim().toLowerCase();
            fetchAndRender();
          }, 220);
        });
      }
      if (sortEl) {
        sortEl.addEventListener('change', () => {
          state.sort = sortEl.value || 'recent';
          fetchAndRender();
        });
      }

      // ── Fetch + render ──
      async function fetchAndRender() {
        root.innerHTML = '<div class="lib-empty">加载中…</div>';
        const qs = new URLSearchParams();
        qs.set('locale', locale);
        qs.set('sort',   state.sort);
        qs.set('limit',  '48');
        if (state.country)  qs.set('country',  state.country);
        if (state.industry) qs.set('industry', state.industry);
        if (state.year)     qs.set('year',     state.year);

        try {
          const r = await fetch('/api/library-list?' + qs.toString());
          if (!r.ok) throw new Error('http ' + r.status);
          const data = await r.json();
          render(data);
        } catch (err) {
          root.innerHTML = '<div class="lib-empty">无法加载研究库，请重试。</div>';
        }
      }

      function render(data) {
        // Client-side filter for search + price (server handles country/industry/year)
        let items = data.items || [];
        if (state.q) {
          const q = state.q;
          items = items.filter(it => {
            return (it.title || '').toLowerCase().includes(q)
                || (it.country || '').toLowerCase().includes(q)
                || (it.industry || '').toLowerCase().includes(q)
                || (it.excerpt || '').toLowerCase().includes(q);
          });
        }
        if (state.price) {
          items = items.filter(it => {
            const p = it.price || 0;
            if (state.price === 'lt30')   return p < 30;
            if (state.price === '30-49')  return p >= 30 && p <= 49;
            if (state.price === 'gt50')   return p >= 50;
            return true;
          });
        }

        if (countEl) {
          countEl.textContent = (items.length || 0) + ' / ' + (data.total || 0) + ' 份报告';
        }

        if (!items.length) {
          root.innerHTML = '<div class="lib-empty">暂无符合当前筛选条件的报告。<a href="?" style="color:var(--primary)">清除筛选 →</a></div>';
          return;
        }

        root.innerHTML = items.map(it => {
          const country  = (it.country  || '').toUpperCase();
          const industry = (it.industry || '').toUpperCase();
          const meta     = [industry, it.year].filter(Boolean).join(' · ');
          const title    = it.title || (humanize(it.slug));
          const excerpt  = it.excerpt || '';
          return (
            '<a href="/' + locale + '/reports/' + escapeAttr(it.slug) + '" class="report-card">' +
              '<div class="report-meta">' +
                '<span class="country">' + escapeHtml(country) + '</span>' +
                '<span>' + escapeHtml(meta) + '</span>' +
              '</div>' +
              '<h3>' + escapeHtml(title) + '</h3>' +
              (excerpt ? '<p class="report-desc">' + escapeHtml(excerpt.slice(0, 180)) + (excerpt.length > 180 ? '…' : '') + '</p>' : '') +
              '<div class="report-footer">' +
                '<span class="report-price">$' + (it.price || 39) + '</span>' +
                '<span class="report-cta">预览 →</span>' +
              '</div>' +
            '</a>'
          );
        }).join('');
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      function escapeAttr(s) { return encodeURIComponent(String(s == null ? '' : s)); }
      function humanize(slug) {
        return String(slug || '')
          .replace(/-/g, ' ')
          .replace(/\b\w/g, c => c.toUpperCase());
      }

      fetchAndRender();
    });
  </script>

  <style>
    body, h1, h2, h3, h4, h5 { font-family: 'Satoshi', 'Noto Sans SC', sans-serif; }
    h1 { line-height: 1.15 !important; letter-spacing: -0.01em !important; }
    p, li { line-height: 1.8; }
    .lib-empty {
      grid-column: 1 / -1;
      padding: 96px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</body>
</html>

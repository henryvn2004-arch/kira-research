<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>研究洞察 — KIRA Research</title>
  <meta name="description" content="分析师对东南亚市场的一线笔记与评论：支付、快消品、物流、医疗科技、能源。" />

  <!-- hreflang -->
  <link rel="alternate" hreflang="en" href="https://kiraresearch.com/en/insights/" />
  <link rel="alternate" hreflang="ja" href="https://kiraresearch.com/ja/insights/" />
  <link rel="alternate" hreflang="ko" href="https://kiraresearch.com/ko/insights/" />
  <link rel="alternate" hreflang="zh-Hans" href="https://kiraresearch.com/zh/insights/" />
  <link rel="alternate" hreflang="x-default" href="https://kiraresearch.com/en/insights/" />
  <link rel="canonical" href="https://kiraresearch.com/zh/insights/" />

  <!-- Open Graph -->
  <meta property="og:title" content="研究洞察 — KIRA Research" />
  <meta property="og:description" content="资深分析师覆盖东南亚市场的一线笔记。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kiraresearch.com/zh/insights/" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" />

  <link rel="stylesheet" href="/css/kira.css" />
</head>
<body>

  <!-- nav + footer injected by /js/nav.js -->

  <div class="container">

    <!-- ── PAGE HERO ───────────────────────────────────── -->
    <header class="lib-header">
      <div class="hero-eyebrow" data-i18n="insights.eyebrow">洞察</div>
      <h1 data-i18n="insights.title">变化中的区域：我们的观察。</h1>
      <p data-i18n="insights.sub">简明分析东南亚正在发生的变化：市场动向、政策信号与研究方法札记。免费阅读。</p>
    </header>

    <!-- ── SEARCH ──────────────────────────────────────── -->
    <div class="insights-search-wrap">
      <svg class="insights-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="insights-search" class="insights-search" type="search" autocomplete="off"
             placeholder="按主题、国家、行业搜索…" aria-label="搜索研究洞察" />
    </div>

    <!-- ── CATEGORY FILTER ─────────────────────────────── -->
    <nav class="insights-cats" aria-label="洞察分类">
      <a href="#" class="active" data-i18n="insights.catAll">全部</a>
      <a href="#" data-cat="vietnam">越南</a>
      <a href="#" data-cat="indonesia">印度尼西亚</a>
      <a href="#" data-cat="thailand">泰国</a>
      <a href="#" data-cat="philippines">菲律宾</a>
      <a href="#" data-cat="fintech">金融科技</a>
      <a href="#" data-cat="fmcg">快消品</a>
      <a href="#" data-cat="logistics">物流</a>
      <a href="#" data-cat="methodology" data-i18n="insights.catMethod">研究方法</a>
    </nav>

    <!-- ── FEATURED + GRID (rendered dynamically) ──────── -->
    <div id="insights-root">
      <div class="insight-empty">正在加载研究洞察…</div>
    </div>

  </div>

  <style>
    body, h1, h2, h3, h4, h5 { font-family: 'Satoshi', 'Noto Sans SC', sans-serif; }
    h1 { line-height: 1.15 !important; letter-spacing: -0.01em !important; }
    p, li { line-height: 1.8; }
    .insight-empty {
      padding: 96px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .insight-card.disabled, .insight-featured.disabled {
      pointer-events: none;
      opacity: 0.6;
    }
    .insight-card .badge-cs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>

  <script src="/js/nav.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const root      = document.getElementById('insights-root');
      const cats      = document.querySelectorAll('.insights-cats a');
      const searchEl  = document.getElementById('insights-search');
      const locale    = (window.kira && window.kira.locale) || 'zh';
      const PAGE_SIZE = 12;
      let activeCat = '';
      let searchQ   = '';
      let page      = 1;
      let searchTimer = null;

      // ── Hydrate active category + page + query from URL (?cat=foo&q=bar&page=N) ──
      const params = new URLSearchParams(window.location.search);
      const initCat = params.get('cat');
      if (initCat) {
        activeCat = initCat.toLowerCase();
        cats.forEach(a => {
          a.classList.toggle('active',
            (a.dataset.cat || '').toLowerCase() === activeCat ||
            (!a.dataset.cat && !activeCat));
        });
      }
      const initQ = params.get('q');
      if (initQ) {
        searchQ = initQ.slice(0, 64);
        if (searchEl) searchEl.value = searchQ;
      }
      const initPage = parseInt(params.get('page'), 10);
      if (initPage && initPage > 0) page = initPage;

      // ── Chip clicks (reset to page 1) ──
      cats.forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          cats.forEach(o => o.classList.remove('active'));
          a.classList.add('active');
          activeCat = (a.dataset.cat || '').toLowerCase();
          page = 1;
          syncUrl();
          fetchAndRender();
        });
      });

      // ── Search input (debounced) ──
      if (searchEl) {
        searchEl.addEventListener('input', () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            searchQ = searchEl.value.trim();
            page = 1;
            syncUrl();
            fetchAndRender();
          }, 220);
        });
      }

      // ── Back/forward navigation ──
      window.addEventListener('popstate', () => {
        const p = new URLSearchParams(window.location.search);
        activeCat = (p.get('cat') || '').toLowerCase();
        searchQ   = (p.get('q')   || '').slice(0, 64);
        if (searchEl) searchEl.value = searchQ;
        page = Math.max(1, parseInt(p.get('page'), 10) || 1);
        cats.forEach(a => {
          a.classList.toggle('active',
            (a.dataset.cat || '').toLowerCase() === activeCat ||
            (!a.dataset.cat && !activeCat));
        });
        fetchAndRender();
      });

      function syncUrl() {
        const p = new URLSearchParams();
        if (activeCat) p.set('cat', activeCat);
        if (searchQ)   p.set('q',   searchQ);
        if (page > 1)  p.set('page', String(page));
        const qs = p.toString();
        const url = window.location.pathname + (qs ? '?' + qs : '');
        window.history.pushState({}, '', url);
      }

      async function fetchAndRender() {
        root.innerHTML = '<div class="insight-empty">加载中…</div>';
        const qs = new URLSearchParams();
        qs.set('locale', locale);
        qs.set('limit',  String(PAGE_SIZE));
        qs.set('offset', String((page - 1) * PAGE_SIZE));
        if (activeCat) qs.set('category', activeCat);
        if (searchQ)   qs.set('q', searchQ);

        try {
          const r = await fetch('/api/insights-list?' + qs.toString());
          if (!r.ok) throw new Error('http ' + r.status);
          const data = await r.json();
          render(data.items || [], data.total || 0);
        } catch (err) {
          root.innerHTML = '<div class="insight-empty">无法加载研究洞察，请重试。</div>';
        }
      }

      function render(items, total) {
        if (!items.length) {
          const msg = searchQ
            ? '没有与“' + escapeHtml(searchQ) + '”匹配的洞察，请尝试更宽泛的关键词。'
            : '暂无符合该筛选条件的洞察。';
          root.innerHTML = '<div class="insight-empty">' + msg + '</div>';
          return;
        }

        const html = [];

        if (page === 1 && !searchQ) {
          // Page 1 (no search): featured + rest as grid.
          const featured = items.find(it => it.featured) || items[0];
          const rest     = items.filter(it => it.slug !== featured.slug);
          html.push(renderFeatured(featured));
          if (rest.length) {
            html.push('<div class="insights-grid">');
            rest.forEach(it => html.push(renderCard(it)));
            html.push('</div>');
          }
        } else {
          // Page 2+: plain grid, no featured.
          html.push('<div class="insights-grid">');
          items.forEach(it => html.push(renderCard(it)));
          html.push('</div>');
        }

        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (totalPages > 1) html.push(renderPager(totalPages));

        root.innerHTML = html.join('');

        // Wire pager buttons.
        const prev = root.querySelector('.insights-pager .pager-prev');
        const next = root.querySelector('.insights-pager .pager-next');
        if (prev) prev.addEventListener('click', (e) => { e.preventDefault(); goTo(page - 1); });
        if (next) next.addEventListener('click', (e) => { e.preventDefault(); goTo(page + 1); });
      }

      function goTo(n) {
        page = Math.max(1, n);
        syncUrl();
        fetchAndRender();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderPager(totalPages) {
        const prevDisabled = page <= 1 ? ' disabled' : '';
        const nextDisabled = page >= totalPages ? ' disabled' : '';
        return (
          '<nav class="insights-pager" aria-label="分页">' +
            '<a href="#" class="pager-prev' + prevDisabled + '"' +
              (prevDisabled ? ' aria-disabled="true"' : '') + '>← 上一页</a>' +
            '<span class="pager-status">第 ' + page + ' / ' + totalPages + ' 页</span>' +
            '<a href="#" class="pager-next' + nextDisabled + '"' +
              (nextDisabled ? ' aria-disabled="true"' : '') + '>下一页 →</a>' +
          '</nav>'
        );
      }

      function renderFeatured(it) {
        const cat = buildCatLabel(it);
        const meta = [formatDate(it.published_at), it.read_time].filter(Boolean).join(' · ');
        const title = it.title || humanize(it.slug);
        const excerpt = it.excerpt || '';
        return (
          '<a href="' + articleHref(it.slug) + '" class="insight-featured' + (it.hasTranslation ? '' : ' disabled') + '">' +
            '<div class="insight-featured-img">' +
              '<span class="ifi-tag">' + escapeHtml(cat || '洞察') + '</span>' +
            '</div>' +
            '<div class="insight-featured-body">' +
              '<div class="insight-meta">' +
                '<span class="cat">精选</span>' +
                '<span>' + escapeHtml(meta || '—') + '</span>' +
              '</div>' +
              '<h2>' + escapeHtml(title) + '</h2>' +
              (excerpt ? '<p class="insight-excerpt">' + escapeHtml(excerpt) + '</p>' : '') +
              '<div class="insight-footer">' +
                '<span>本公司研究团队</span>' +
                '<span class="read">' + (it.hasTranslation ? '阅读 →' : '翻译中…') + '</span>' +
              '</div>' +
            '</div>' +
          '</a>'
        );
      }

      function renderCard(it) {
        const cat = buildCatLabel(it);
        const date = formatDate(it.published_at);
        const title = it.title || humanize(it.slug);
        const excerpt = it.excerpt || '';
        const readTime = it.read_time || '';
        return (
          '<a href="' + articleHref(it.slug) + '" class="insight-card' + (it.hasTranslation ? '' : ' disabled') + '">' +
            '<div class="insight-meta">' +
              '<span class="cat">' + escapeHtml(cat || '洞察') + '</span>' +
              '<span>' + escapeHtml(date) + '</span>' +
            '</div>' +
            '<h3>' + escapeHtml(title) + '</h3>' +
            (excerpt ? '<p class="insight-excerpt">' + escapeHtml(excerpt) + '</p>' : '') +
            '<div class="insight-footer">' +
              '<span>' + escapeHtml(readTime || '—') + '</span>' +
              '<span class="read">' + (it.hasTranslation ? '阅读 →' : '翻译中…') + '</span>' +
            '</div>' +
          '</a>'
        );
      }

      function articleHref(slug) {
        return '/' + locale + '/insights/' + encodeURIComponent(slug);
      }

      function buildCatLabel(it) {
        const parts = [];
        if (it.country)  parts.push(it.country.toUpperCase());
        if (it.industry) parts.push(it.industry.toUpperCase());
        if (!parts.length && it.category) parts.push(it.category.toUpperCase());
        return parts.join(' · ');
      }

      function formatDate(iso) {
        if (!iso) return '';
        return new Date(iso).toLocaleDateString('zh-CN', { month: 'short', year: 'numeric' }).toUpperCase();
      }

      function humanize(slug) {
        return String(slug || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      fetchAndRender();
    });
  </script>
</body>
</html>

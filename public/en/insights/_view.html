<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insight — KIRA RESEARCH</title>
  <meta name="description" content="Field notes and analyst commentary from KIRA RESEARCH." />

  <link rel="canonical" id="meta-canonical" href="https://kiraresearch.com/en/insights/" />

  <!-- Open Graph + Twitter Card defaults; filled per-article when data loads. -->
  <meta property="og:type"        content="article" />
  <meta property="og:site_name"   content="KIRA RESEARCH" />
  <meta property="og:title"       id="meta-og-title"       content="Insight — KIRA RESEARCH" />
  <meta property="og:description" id="meta-og-description" content="Field notes and analyst commentary from KIRA RESEARCH." />
  <meta property="og:url"         id="meta-og-url"         content="https://kiraresearch.com/" />
  <meta property="og:image"       id="meta-og-image"       content="https://kiraresearch.com/og-image.png" />
  <meta property="og:locale"      id="meta-og-locale"      content="en_US" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       id="meta-tw-title"       content="Insight — KIRA RESEARCH" />
  <meta name="twitter:description" id="meta-tw-description" content="Field notes and analyst commentary from KIRA RESEARCH." />
  <meta name="twitter:image"       id="meta-tw-image"       content="https://kiraresearch.com/og-image.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="/css/kira.css" />
  <link rel="stylesheet" href="/css/research.css" />

</head>
<body>

  <!-- nav + footer injected by /js/nav.js -->

  <div id="art-root">
    <div class="r-container art-loading" style="padding-block:96px;text-align:center;color:var(--muted)">…</div>
  </div>

  <script src="/js/nav.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/research-i18n.js" defer></script>

  <script type="module">
    // ── 1) Parse slug + locale from URL ──────────────────
    const parts  = window.location.pathname.split('/').filter(Boolean);
    const locale = ['en','ja','ko','zh'].includes(parts[0]) ? parts[0] : 'en';
    // BCP-47 tag for <html lang>, hreflang and JSON-LD inLanguage (Chinese is Simplified-only).
    const langTag = l => (l === 'zh' ? 'zh-Hans' : l);
    const slug   = parts[2] ? parts[2].replace(/\/$/, '') : '';

    document.documentElement.setAttribute('lang', langTag(locale));

    const root = document.getElementById('art-root');
    const R = window.kiraR, t = R.t;   // /js/research-i18n.js (deferred, runs before this module)
    const msg = (title, body) => '<div class="r-container"><div class="r-empty"><h3>' + escapeHtml(title) + '</h3>' + (body ? '<p>' + body + '</p>' : '') + '<a class="r-btn r-btn-outline" href="/' + locale + '/insights/">' + escapeHtml(t('viewAll')) + '</a></div></div>';

    if (!slug) {
      root.innerHTML = msg(t('noInsights'));
      throw new Error('halt');
    }

    // ── 2) Fetch from API ────────────────────────────────
    let data;
    try {
      const r = await fetch('/api/insight?slug=' + encodeURIComponent(slug) + '&locale=' + locale);
      if (r.status === 404) {
        const body = await r.json().catch(() => ({}));
        root.innerHTML = msg(body.error === 'translation_missing' ? t('fallback') : t('noInsights'));
        throw new Error('halt');
      }
      if (!r.ok) throw new Error('http ' + r.status);
      data = await r.json();
    } catch (err) {
      if (err && err.message === 'halt') throw err;
      root.innerHTML = msg(t('loadError'));
      throw new Error('halt');
    }

    // ── 3) Update meta + hreflang ────────────────────────
    const base = 'https://kiraresearch.com';
    const url  = base + '/' + locale + '/insights/' + data.slug;
    const fullTitle   = (data.title || 'Insight') + ' — KIRA RESEARCH';
    const description = (data.excerpt || data.lede || 'Field notes from KIRA RESEARCH.').slice(0, 200);
    const ogLocale    = { en: 'en_US', ja: 'ja_JP', ko: 'ko_KR', zh: 'zh_CN' }[locale] || 'en_US';

    document.title = fullTitle;
    document.getElementById('meta-canonical').href = url;
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', description);

    const head = document.head;
    ['en','ja','ko','zh'].forEach(loc => {
      if (data.availableLocales.includes(loc)) {
        const link = document.createElement('link');
        link.rel  = 'alternate';
        link.hreflang = langTag(loc);
        link.href = base + '/' + loc + '/insights/' + data.slug;
        head.appendChild(link);
      }
    });
    const xdef = document.createElement('link');
    xdef.rel = 'alternate'; xdef.hreflang = 'x-default';
    xdef.href = base + '/en/insights/' + data.slug;
    head.appendChild(xdef);

    // ── OG + Twitter (fill placeholders, then add article-specific) ──
    setMetaContent('meta-og-title',       fullTitle);
    setMetaContent('meta-og-description', description);
    setMetaContent('meta-og-url',         url);
    setMetaContent('meta-og-locale',      ogLocale);
    setMetaContent('meta-tw-title',       fullTitle);
    setMetaContent('meta-tw-description', description);
    if (data.published_at) setMeta('property', 'article:published_time', data.published_at);
    if (data.cover) { setMetaContent('meta-og-image', data.cover.full); setMetaContent('meta-tw-image', data.cover.full); }

    // ── JSON-LD: Article + FAQPage + BreadcrumbList ──
    // FAQPage schema: when body contains <h2> sections formatted as Q&A
    // (starting with "Q:" or question words), extract them for Featured Snippet
    // eligibility. LLMs (Perplexity, ChatGPT) also prioritise pages with FAQ
    // markup when building cited answers.
    const faqMatches = [];
    const bodyHtml = data.body || '';
    // Extract Q&A pairs: looks for <strong>Q: ...</strong> ... <p>answer</p> pattern
    const faqRe = /<strong>Q:\s*([^<]+)<\/strong>[^]*?<\/strong>\s*([\s\S]*?)(?=<strong>Q:|$)/g;
    let fm;
    while ((fm = faqRe.exec(bodyHtml)) !== null && faqMatches.length < 8) {
      const q = fm[1].trim();
      const aRaw = fm[2].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 300);
      if (q && aRaw) faqMatches.push({ '@type': 'Question', name: q,
        acceptedAnswer: { '@type': 'Answer', text: aRaw } });
    }

    const articleLd = {
      '@context':       'https://schema.org',
      '@type':          'Article',
      headline:         data.title || data.slug,
      description,
      url,
      datePublished:    data.published_at || undefined,
      dateModified:     data.published_at || undefined,
      inLanguage:       langTag(locale),
      author: {
        '@type': 'Organization',
        name:    'Kira Research',
        url:     base + '/'
      },
      publisher: {
        '@type': 'Organization',
        name:    'Kira Research',
        url:     base + '/',
        logo: { '@type': 'ImageObject', url: base + '/logo.png' }
      },
      image:            (data.cover && data.cover.full) || base + '/logo.png',
      mainEntityOfPage: url
    };
    injectJsonLd('ld-article', articleLd);

    if (faqMatches.length >= 2) {
      injectJsonLd('ld-faq', {
        '@context':   'https://schema.org',
        '@type':      'FAQPage',
        mainEntity:   faqMatches
      });
    }

    const crumbs = [
      { name: 'KIRA RESEARCH', item: base + '/' + locale + '/' },
      { name: 'Insights',      item: base + '/' + locale + '/insights/' }
    ];
    if (data.country) {
      const c = data.country;
      crumbs.push({
        name: c.charAt(0).toUpperCase() + c.slice(1),
        item: base + '/' + locale + '/insights/?cat=' + encodeURIComponent(c)
      });
    }
    crumbs.push({ name: data.title || data.slug, item: url });
    injectJsonLd('ld-breadcrumb', {
      '@context':      'https://schema.org',
      '@type':         'BreadcrumbList',
      itemListElement: crumbs.map((c, i) => ({
        '@type':   'ListItem',
        position:  i + 1,
        name:      c.name,
        item:      c.item
      }))
    });

    // ── 4) Render ────────────────────────────────────────
    render(data);

    if (window.kira && window.kira.i18n) window.kira.i18n.apply();

    // ── helpers ──────────────────────────────────────────
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function setMeta(attr, name, content) {
      let el = document.querySelector('meta[' + attr + '="' + name + '"]');
      if (!el) { el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
      el.setAttribute('content', content || '');
    }
    function setMetaContent(id, value) {
      const el = document.getElementById(id);
      if (el) el.setAttribute('content', value || '');
    }
    function injectJsonLd(id, payload) {
      // Strip undefined keys so JSON.stringify doesn't emit `"key":undefined`.
      const clean = JSON.parse(JSON.stringify(payload));
      let el = document.getElementById(id);
      if (!el) {
        el = document.createElement('script');
        el.type = 'application/ld+json';
        el.id   = id;
        document.head.appendChild(el);
      }
      el.textContent = JSON.stringify(clean);
    }
    function renderReportBox(r) {
      if (!r) return '';
      return '<div class="art-report">' +
        '<div class="cover-thumb">' + (r.cover ? '<img src="' + escapeHtml(r.cover.thumb) + '" alt="" loading="lazy" width="360" height="480">' : '<div class="ph"><b>KIRA</b><span>' + escapeHtml(r.title || '') + '</span></div>') + '</div>' +
        '<div><div class="k">' + escapeHtml(t('getFull')) + ' · ' + escapeHtml([R.country(r.country), r.industry, r.year].filter(Boolean).join(' · ')) + '</div>' +
          '<h3>' + escapeHtml(r.title || r.slug) + '</h3>' +
          '<p>' + escapeHtml(t('getFullBody')) + '</p>' +
          '<a class="r-btn r-btn-primary" href="/' + locale + '/reports/' + encodeURIComponent(r.slug) + '">' + escapeHtml(t('openReport')) + R.icon('arrow') + '</a></div>' +
      '</div>';
    }
    function renderContinue(items) {
      if (!Array.isArray(items) || !items.length) return '';
      return '<section class="rd-sec" style="margin-top:36px"><h2 class="rd-sec-h"><span class="ib">' + R.icon('book') + '</span>' + escapeHtml(t('continueReading')) + '</h2><div class="rcards">' +
        items.slice(0, 3).map(it => '<a class="rcard" href="/' + locale + '/insights/' + encodeURIComponent(it.slug) + '">' +
          '<div class="img">' + (it.cover ? '<img src="' + escapeHtml(it.cover.wide) + '" alt="" loading="lazy" width="800" height="500">' : '') + '</div>' +
          '<div class="body"><div class="kick"><span>' + escapeHtml([R.country(it.country), R.sector(it.industry)].filter(Boolean).join(' · ')) + '</span>' +
            (it.published_at ? '<span class="d">' + escapeHtml(R.date(it.published_at)) + '</span>' : '') + '</div>' +
          '<h3>' + escapeHtml(it.title || it.slug) + '</h3>' +
          '<div class="foot"><span></span><span class="go">' + escapeHtml(t('readArticle')) + R.icon('arrow') + '</span></div></div></a>').join('') +
        '</div></section>';
    }
    // Number the article's top-level sections (01, 02 …): h2, or h3 when the
    // body has no h2 (bodies converted from markdown start at ###).
    function numberSections(html) {
      const tag = /<h2[\s>]/i.test(html) ? 'h2' : 'h3';
      let n = 0;
      return html.replace(new RegExp('<' + tag + '(\\s[^>]*)?>', 'gi'), (m, attrs) => '<' + tag + (attrs || '') + '><span class="n">' + String(++n).padStart(2, '0') + '</span>');
    }
    function render(d) {
      const report = (d.relatedReports || [])[0] || null;
      const minutes = (String(d.read_time || '').match(/\d+/) || [])[0];
      const catLabel = d.category ? d.category.replace(/-/g, ' ') : t('insights');
      const pageUrl = 'https://kiraresearch.com/' + locale + '/insights/' + encodeURIComponent(d.slug);
      const fallbackBanner = d.isFallback ? '<div class="rd-banner">' + escapeHtml(t('fallback')) + '</div>' : '';
      // body is HTML stored in the DB (admin-trusted: written only with the service key).
      const body = numberSections(d.body || '');

      root.innerHTML =
        '<div class="r-band"><div class="r-container" style="padding-block:14px 32px">' +
          '<nav class="r-crumbs" aria-label="Breadcrumb"><a href="/' + locale + '/insights/">' + escapeHtml(t('insights')) + '</a>' +
            (d.country ? '<span class="sep">›</span><a href="/' + locale + '/insights/?cat=' + encodeURIComponent(String(d.country).toLowerCase()) + '">' + escapeHtml(R.country(d.country)) + '</a>' : '') + '</nav>' +
          fallbackBanner +
          '<div class="art-hero">' +
            '<div>' +
              '<div class="kick"><span class="chip">' + escapeHtml(catLabel) + '</span>' +
                (d.country ? '<span>' + escapeHtml(R.country(d.country)) + '</span>' : '') +
                (d.industry ? '<span>' + escapeHtml(R.sector(d.industry)) + '</span>' : '') +
                (d.published_at ? '<span>' + escapeHtml(R.date(d.published_at, 'long')) + '</span>' : '') +
                (minutes ? '<span>' + escapeHtml(minutes + ' ' + t('minRead')) + '</span>' : '') + '</div>' +
              '<h1>' + escapeHtml(d.title || d.slug) + '</h1>' +
              (d.lede || d.excerpt ? '<p class="lede">' + escapeHtml(d.lede || d.excerpt) + '</p>' : '') +
              '<div class="meta"><span>' + R.icon('user') + escapeHtml(t('byTeam')) + '</span>' +
                (report ? '<span>' + R.icon('doc') + '<a class="r-link" href="/' + locale + '/reports/' + encodeURIComponent(report.slug) + '">' + escapeHtml(t('getFull')) + '</a></span>' : '') + '</div>' +
            '</div>' +
            (d.cover ? '<div class="img"><img src="' + escapeHtml(d.cover.full) + '" alt="" width="1536" height="1024" decoding="async" fetchpriority="high">' +
              (d.country || d.industry ? '<span class="pill">' + escapeHtml([R.country(d.country), R.sector(d.industry)].filter(Boolean).join(' · ')) + '</span>' : '') + '</div>' : '') +
          '</div>' +
        '</div></div>' +
        '<div class="r-container"><div class="art">' +
          '<div style="min-width:0">' +
            '<div class="art-body"><div class="article-body">' + body + '</div>' + renderReportBox(report) + '</div>' +
            renderContinue(d.relatedInsights) +
          '</div>' +
          '<aside class="ins-side">' +
            '<div class="ins-box"><h3>' + escapeHtml(t('share')) + '</h3><div class="rd-share">' +
              '<button type="button" id="art-copy">' + R.icon('link') + '<span>' + escapeHtml(t('copyLink')) + '</span></button>' +
              '<a href="https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(pageUrl) + '" target="_blank" rel="noopener">LinkedIn</a>' +
              '<a href="https://x.com/intent/post?url=' + encodeURIComponent(pageUrl) + '" target="_blank" rel="noopener">X</a></div></div>' +
            (report ? '<div class="ins-box soft"><div class="ib">' + R.icon('book') + '</div><h3>' + escapeHtml(report.title || report.slug) + '</h3><p>' + escapeHtml(t('getFullBody')) + '</p>' +
              '<a class="r-btn r-btn-primary r-btn-block" href="/' + locale + '/reports/' + encodeURIComponent(report.slug) + '">' + escapeHtml(t('openReport')) + R.icon('arrow') + '</a></div>' : '') +
            '<div class="ins-box soft"><div class="ib">' + R.icon('layers') + '</div><h3>' + escapeHtml(t('exploreLib')) + '</h3><p>' + escapeHtml(t('exploreLibBody')) + '</p>' +
              '<a class="r-btn r-btn-outline r-btn-block" href="/' + locale + '/library">' + escapeHtml(t('browseLib')) + R.icon('arrow') + '</a>' +
              '<p style="margin:12px 0 0"><a class="r-link" href="/' + locale + '/insights/">' + escapeHtml(t('viewAll')) + ' →</a></p></div>' +
          '</aside>' +
        '</div></div>';

      const copyBtn = document.getElementById('art-copy');
      if (copyBtn) copyBtn.addEventListener('click', () => {
        const label = copyBtn.querySelector('span');
        (navigator.clipboard ? navigator.clipboard.writeText(pageUrl) : Promise.reject()).then(
          () => { label.textContent = t('copied'); }, () => { prompt('', pageUrl); });
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Report — KIRA RESEARCH</title>
  <meta name="description" content="Market intelligence report from KIRA RESEARCH." />

  <link rel="canonical" id="meta-canonical" href="https://kiraresearch.com/en/" />

  <!-- Open Graph + Twitter Card defaults; overridden per-report by updateHead() once data loads. -->
  <meta property="og:type"        content="article" />
  <meta property="og:site_name"   content="KIRA RESEARCH" />
  <meta property="og:title"       id="meta-og-title"       content="Report — KIRA RESEARCH" />
  <meta property="og:description" id="meta-og-description" content="Market intelligence report from KIRA RESEARCH." />
  <meta property="og:url"         id="meta-og-url"         content="https://kiraresearch.com/" />
  <meta property="og:image"       id="meta-og-image"       content="https://kiraresearch.com/og-image.png" />
  <meta property="og:locale"      id="meta-og-locale"      content="en_US" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       id="meta-tw-title"       content="Report — KIRA RESEARCH" />
  <meta name="twitter:description" id="meta-tw-description" content="Market intelligence report from KIRA RESEARCH." />
  <meta name="twitter:image"       id="meta-tw-image"       content="https://kiraresearch.com/og-image.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="/css/kira.css" />

  <!-- Supabase client + kiraAuth (for purchase state) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>

  <link rel="stylesheet" href="/css/research.css" />
</head>
<body>

  <!-- nav + footer injected by /js/nav.js -->

  <div id="rpt-root">
    <div class="r-container" style="padding-block:96px;text-align:center;color:var(--muted)">…</div>
  </div>

  <!-- Locked-section dialog: opened from a locked row in the contents. -->
  <div id="unlock-modal" class="rd-modal" hidden>
    <div class="rd-modal-card" role="dialog" aria-modal="true" aria-labelledby="unlock-modal-title">
      <button class="x" id="unlock-modal-close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="rd-eyebrow" id="unlock-modal-eyebrow"></div>
      <h3 id="unlock-modal-title">Section</h3>
      <p id="unlock-modal-body"></p>
      <button class="r-btn r-btn-primary r-btn-block" id="unlock-modal-buy"></button>
      <p class="unlock-modal-footnote" style="font-size:12px;color:var(--muted-dim);text-align:center;margin:10px 0 0"></p>
    </div>
  </div>

  <script src="/js/nav.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/research-i18n.js" defer></script>

  <script type="module">
    // ── 1) URL parsing ───────────────────────────────────
    const parts  = window.location.pathname.split('/').filter(Boolean);
    const locale = ['en','ja','ko','zh'].includes(parts[0]) ? parts[0] : 'en';
    const slug   = parts[2] ? parts[2].replace(/\/$/, '') : '';
    const qs     = new URLSearchParams(window.location.search);
    const paypalReturn = qs.get('paypal');     // 'success' or 'cancel'
    const paypalToken  = qs.get('token');      // PayPal order id when returning

    // <html lang>: Chinese is Simplified-only → BCP-47 'zh-Hans'.
    document.documentElement.setAttribute('lang', locale === 'zh' ? 'zh-Hans' : locale);

    // ── Per-report purchase switch (Sprint S5) ──────────────
    // false → the $39 single-report checkout is hidden; the buy box, preview
    // CTA and locked-section modal point to the subscription waitlist instead.
    // true  → restores the original PayPal per-report flow (all payment code
    // below is kept intact). Existing buyers keep full access either way.
    const PER_REPORT_PURCHASE = false;
    const WAITLIST_URL = '/en/pricing#waitlist';

    // Preview iframe geometry. Source HTML is authored at 1280×720 per page
    // (matches the PDF). 5 pages × 720px = 3600px tall. Declared up here so
    // renderPreviewFrame() and fitPreviewFrame() — both called from render()
    // — can reference them without hitting the TDZ.
    const PREVIEW_PAGE_W = 1280;
    const PREVIEW_PAGE_H = 720;
    const PREVIEW_PAGES  = 5;

    const root = document.getElementById('rpt-root');
    const R = window.kiraR, t = R.t;   // /js/research-i18n.js (deferred, runs before this module)
    const msg = (title, body) => '<div class="r-container"><div class="r-empty"><h3>' + escapeHtml(title) + '</h3>' + (body ? '<p>' + body + '</p>' : '') + '<a class="r-btn r-btn-outline" href="/' + locale + '/library">' + escapeHtml(t('backLibrary')) + '</a></div></div>';

    if (!slug) {
      root.innerHTML = msg(t('notFound'));
      // Stop module execution.
      throw new Error('halt');
    }

    // Wait for kiraAuth (auth.js is a classic <script>).
    while (!window.kiraAuth) await new Promise(r => setTimeout(r, 20));

    // ── 2) Capture PayPal return BEFORE anything else ────
    // Doing this first means the user lands on the unlocked view directly
    // instead of seeing the preview flash, then a swap.
    let captureResult = null;
    if (paypalReturn === 'success' && paypalToken) {
      root.innerHTML = msg('Finalising your purchase…', 'Please do not close this tab.');
      captureResult = await capturePurchase(paypalToken);
      // Strip query string from URL so refresh doesn't re-capture.
      const cleanUrl = window.location.pathname;
      window.history.replaceState({}, '', cleanUrl);
    }

    // ── 3) Fetch report base + (if logged in) verify purchase ───
    let data;
    try {
      const r = await fetch('/api/library-report?slug=' + encodeURIComponent(slug) + '&locale=' + locale);
      if (r.status === 404) {
        root.innerHTML = msg(t('notFound'), escapeHtml(t('notFoundBody')));
        throw new Error('halt');
      }
      if (!r.ok) throw new Error('http ' + r.status);
      data = await r.json();
    } catch (err) {
      if (err && err.message === 'halt') throw err;
      root.innerHTML = msg(t('loadError'));
      throw new Error('halt');
    }

    // ── 4) Check purchase state + fetch full content if owned ──
    let purchaseState = { purchased: false, anyLocale: false };
    let fullContent   = null;
    const user = await window.kiraAuth.getUser();
    if (user) {
      purchaseState = await verifyPurchase(data.slug, locale);
      if (purchaseState.purchased) {
        fullContent = await fetchFullContent(data.slug, locale);
      }
    }

    // ── 5) Meta + hreflang ───────────────────────────────
    updateHead(data);

    // ── 6) Render ────────────────────────────────────────
    render(data, purchaseState, fullContent, captureResult);

    if (window.kira && window.kira.i18n) window.kira.i18n.apply();

    // ── 7) Key Players strip (async, VN reports only) ────
    const _countryUp = (data.country || '').toUpperCase();
    if ((_countryUp === 'VN' || _countryUp === 'VIETNAM') && data.industry) {
      loadKeyPlayers(data.industry, locale);
    }

    async function loadKeyPlayers(industry, _locale) {
      try {
        const r = await fetch(
          '/api/company-list?country=VN&industry=' + encodeURIComponent(industry),
          { signal: AbortSignal.timeout(5000) }
        );
        if (!r.ok) return;
        const { companies } = await r.json();
        const top = (companies || []).filter(c => c.slug).slice(0, 5);
        if (top.length < 2) return;

        const chips = top.map(c =>
          '<a href="/en/companies/vn/' + encodeURIComponent(c.slug) + '" class="rpt-kp-chip">' +
            '<span>' + escapeHtml(c.name) + '</span>' +
            (c.sector ? '<span class="kp-sector">' +
              escapeHtml(c.sector.replace(/_/g, ' ').toUpperCase()) +
            '</span>' : '') +
          '</a>'
        ).join('');

        const slot = document.getElementById('rpt-key-players-slot');
        if (!slot) return;
        slot.innerHTML =
          '<section class="rpt-key-players">' +
            '<h4>Key players in this market</h4>' +
            '<p class="kp-intro">VN companies tracked by KIRA Company Intelligence</p>' +
            '<div class="rpt-kp-grid">' + chips + '</div>' +
            '<div class="rpt-kp-footer">' +
              '<a href="/en/companies/vn/">View all companies in the directory →</a>' +
            '</div>' +
          '</section>';
      } catch (_) {}
    }

    // ══════════════════════════════════════════════════════
    //  Auth / purchase helpers
    // ══════════════════════════════════════════════════════
    async function bearerHeaders() {
      const session = (await window.db.auth.getSession()).data.session;
      return session ? { 'Authorization': 'Bearer ' + session.access_token } : {};
    }

    async function verifyPurchase(slug, locale) {
      try {
        const r = await fetch('/api/library-verify?slug=' + encodeURIComponent(slug) + '&locale=' + locale, {
          headers: await bearerHeaders()
        });
        if (!r.ok) return { purchased: false, anyLocale: false };
        return await r.json();
      } catch (_) {
        return { purchased: false, anyLocale: false };
      }
    }

    async function fetchFullContent(slug, locale) {
      try {
        const r = await fetch('/api/library-content?slug=' + encodeURIComponent(slug) + '&locale=' + locale, {
          headers: await bearerHeaders()
        });
        if (!r.ok) return null;
        return await r.json();
      } catch (_) { return null; }
    }

    async function capturePurchase(orderId) {
      // Capture REQUIRES the user to be signed in. If they aren't, prompt
      // login first and pass the order through sessionStorage so we can
      // resume the capture once they're back.
      const session = (await window.db.auth.getSession()).data.session;
      if (!session) {
        sessionStorage.setItem('kira_pending_capture', orderId);
        sessionStorage.setItem('kira_redirect_after_login', window.location.pathname);
        window.location.href = '/auth.html?msg=' + encodeURIComponent('Sign in to finalise your purchase');
        throw new Error('redirecting_to_login');
      }
      try {
        const r = await fetch('/api/library-buy?action=capture', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
          body:    JSON.stringify({ orderId })
        });
        const body = await r.json();
        return { ok: r.ok, ...body };
      } catch (err) {
        return { ok: false, error: 'network' };
      }
    }

    async function startCheckout(slug, locale) {
      // Require login first — capture step needs auth anyway.
      const user = await window.kiraAuth.getUser();
      if (!user) {
        sessionStorage.setItem('kira_redirect_after_login', window.location.pathname);
        window.location.href = '/auth.html?msg=' + encodeURIComponent('Sign in to purchase this report');
        return;
      }
      try {
        const r = await fetch('/api/library-buy?action=create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body:   JSON.stringify({ slug, locale })
        });
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          alert('Could not start checkout (' + (body.error || r.status) + ').');
          return;
        }
        const body = await r.json();
        if (body.approveUrl) {
          window.location.href = body.approveUrl;
        } else {
          alert('Checkout error: no approval URL returned.');
        }
      } catch (err) {
        alert('Network error starting checkout. Please retry.');
      }
    }

    // ══════════════════════════════════════════════════════
    //  Render helpers
    // ══════════════════════════════════════════════════════
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function updateHead(d) {
      const base = 'https://kiraresearch.com';
      const url  = base + '/' + locale + '/reports/' + d.slug;
      const fullTitle = (d.title || 'Report') + ' — KIRA RESEARCH';
      const description = (d.preview && d.preview.lede)
        ? d.preview.lede.slice(0, 200)
        : 'Market intelligence report from KIRA RESEARCH.';
      // og:locale uses underscore region format. x-default reports → en_US.
      const ogLocale = { en: 'en_US', ja: 'ja_JP', ko: 'ko_KR', zh: 'zh_CN' }[locale] || 'en_US';

      document.title = fullTitle;
      document.getElementById('meta-canonical').href = url;

      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', description);

      // ── OG + Twitter ────────────────────────────────────
      setMetaContent('meta-og-title',       fullTitle);
      setMetaContent('meta-og-description', description);
      setMetaContent('meta-og-url',         url);
      setMetaContent('meta-og-locale',      ogLocale);
      setMetaContent('meta-tw-title',       fullTitle);
      setMetaContent('meta-tw-description', description);

      // ── hreflang ────────────────────────────────────────
      ['en','ja','ko','zh'].forEach(loc => {
        if (d.availableLocales.includes(loc)) {
          const link = document.createElement('link');
          link.rel = 'alternate'; link.hreflang = loc === 'zh' ? 'zh-Hans' : loc;
          link.href = base + '/' + loc + '/reports/' + d.slug;
          document.head.appendChild(link);
        }
      });
      const xdef = document.createElement('link');
      xdef.rel = 'alternate'; xdef.hreflang = 'x-default';
      xdef.href = base + '/en/reports/' + d.slug;
      document.head.appendChild(xdef);

      // ── JSON-LD: Product + Dataset + Paywall spec ────────
      // Product: signals price/purchase intent to Google Shopping + AI engines.
      // Dataset: signals high-value structured data — Perplexity/ChatGPT cite pages
      //          with Dataset markup at higher rates than plain Article.
      // isAccessibleForFree + hasPart: Google Paywall spec — tells Googlebot the
      //          .report-full-content block is paywalled so it doesn't flag cloaking,
      //          while still crawling the preview abstract/TOC/tables above it.
      injectJsonLd('ld-product', {
        '@context': 'https://schema.org',
        '@graph': [
          {
            '@type':       'Product',
            '@id':         url + '#product',
            name:          d.title || d.slug,
            description,
            url,
            sku:           d.slug,
            category:      [d.industry, d.country].filter(Boolean).join(' · ') || 'Market Research',
            brand: {
              '@type': 'Organization',
              name:    'Kira Research',
              url:     base + '/'
            },
            publisher: {
              '@type': 'Organization',
              name:    'Kira Research',
              url:     base + '/',
              logo: { '@type': 'ImageObject', url: base + '/logo.png' }
            },
            // Single-report offer only while per-report purchase is on.
            ...(PER_REPORT_PURCHASE ? {
              offers: {
                '@type':        'Offer',
                price:          String(d.price || 39),
                priceCurrency:  'USD',
                availability:   'https://schema.org/InStock',
                url
              }
            } : {}),
            isAccessibleForFree: 'False',
            hasPart: {
              '@type':              'WebPageElement',
              isAccessibleForFree:  'False',
              cssSelector:          '.report-full-content'
            }
          },
          {
            '@type':          'Dataset',
            '@id':            url + '#dataset',
            name:             (d.title || d.slug) + ' — Market Data',
            description:      'Market intelligence from desk research covering ' +
                              [d.industry, d.country].filter(Boolean).join(' in ') +
                              (d.year ? ', ' + d.year : '') +
                              '. Includes market sizing, competitive landscape, and trend analysis.',
            creator: {
              '@type': 'Organization',
              name:    'Kira Research',
              url:     base + '/'
            },
            spatialCoverage:  d.country  || undefined,
            keywords:         [d.industry, d.country, 'market research', 'Southeast Asia'].filter(Boolean),
            license:          base + '/en/methodology',
            isPartOf:         { '@id': url + '#product' }
          }
        ]
      });

      const crumbs = [
        { name: 'KIRA RESEARCH',   item: base + '/' + locale + '/' },
        { name: 'Library',         item: base + '/' + locale + '/library' }
      ];
      if (d.country)  crumbs.push({ name: d.country,  item: base + '/' + locale + '/library?country='  + d.country.toLowerCase() });
      if (d.industry) crumbs.push({ name: d.industry, item: base + '/' + locale + '/library?industry=' + d.industry.toLowerCase().replace(/[^a-z0-9]+/g, '-') });
      crumbs.push({ name: d.title || d.slug, item: url });

      injectJsonLd('ld-breadcrumb', {
        '@context':        'https://schema.org',
        '@type':           'BreadcrumbList',
        itemListElement:   crumbs.map((c, i) => ({
          '@type':    'ListItem',
          position:   i + 1,
          name:       c.name,
          item:       c.item
        }))
      });
    }

    function setMetaContent(id, value) {
      const el = document.getElementById(id);
      if (el) el.setAttribute('content', value || '');
    }

    function injectJsonLd(id, payload) {
      // Idempotent: replace if already present (re-render after locale fallback).
      let el = document.getElementById(id);
      if (!el) {
        el = document.createElement('script');
        el.type = 'application/ld+json';
        el.id   = id;
        document.head.appendChild(el);
      }
      el.textContent = JSON.stringify(payload);
    }


    // ══════════════════════════════════════════════════════
    //  Page sections (library redesign, 2026-10)
    // ══════════════════════════════════════════════════════
    // Public data tables from preview_tables JSON ([{title, source, html}]);
    // fully crawlable, shown before the paywall.
    function renderPreviewTables(tables) {
      if (!Array.isArray(tables) || !tables.length) return '';
      return tables.slice(0, 2).map(tb => {
        if (!tb || !tb.html) return '';
        return '<div class="rd-card">' +
          (tb.title ? '<h3>' + escapeHtml(tb.title) + '</h3>' : '') +
          '<div class="rd-table">' + tb.html + '</div>' +
          (tb.source ? '<p class="src">' + escapeHtml(t('source')) + ': ' + escapeHtml(tb.source) + '</p>' : '') +
        '</div>';
      }).join('');
    }

    function renderChart(c) {
      if (!c || !Array.isArray(c.bars) || !c.bars.length) return '';
      const bars = c.bars.map(b => {
        const pct = Math.max(2, Math.min(100, Number(b.pct) || 0));
        return '<div class="bar" style="height:' + pct + '%"><span class="v">' + escapeHtml(b.value) + '</span><span class="l">' + escapeHtml(b.label) + '</span></div>';
      }).join('');
      return '<div class="rd-card">' +
        '<h3>' + escapeHtml(c.title || '') + '</h3>' +
        (c.subtitle ? '<p class="rd-note" style="margin:0">' + escapeHtml(c.subtitle) + '</p>' : '') +
        '<div class="rd-chart">' + bars + '</div>' +
      '</div>';
    }

    function cardImg(cover) {
      return '<div class="img">' + (cover ? '<img src="' + escapeHtml(cover.wide) + '" alt="" loading="lazy" decoding="async" width="800" height="500">' : '') + '</div>';
    }
    // "Continue reading": related insights first, then related reports, max 3.
    function renderContinue(d) {
      const ins = (d.relatedInsights || []).map(it => (
        '<a class="rcard" href="/' + locale + '/insights/' + encodeURIComponent(it.slug) + '">' + cardImg(it.cover) +
          '<div class="body"><div class="kick"><span>' + escapeHtml([R.country(it.country), it.industry].filter(Boolean).join(' · ')) + '</span>' +
            (it.read_time ? '<span class="d">' + escapeHtml(it.read_time) + '</span>' : '') + '</div>' +
          '<h3>' + escapeHtml(it.title || it.slug) + '</h3>' +
          (it.excerpt ? '<p>' + escapeHtml(it.excerpt) + '</p>' : '') +
          '<div class="foot"><span></span><span class="go">' + escapeHtml(t('readArticle')) + R.icon('arrow') + '</span></div></div></a>'));
      const reps = (d.relatedReports || []).map(it => (
        '<a class="rcard" href="/' + locale + '/reports/' + encodeURIComponent(it.slug) + '">' + cardImg(it.cover) +
          '<div class="body"><div class="kick"><span>' + escapeHtml([R.country(it.country), it.industry].filter(Boolean).join(' · ')) + '</span>' +
            (it.year ? '<span class="d">' + escapeHtml(it.year) + '</span>' : '') + '</div>' +
          '<h3>' + escapeHtml(it.title || it.slug) + '</h3>' +
          '<div class="foot"><span></span><span class="go">' + escapeHtml(t('viewReport')) + R.icon('arrow') + '</span></div></div></a>'));
      const cards = ins.slice(0, 3).concat(reps).slice(0, 3);
      if (!cards.length) return '';
      return '<section class="rd-sec" id="related"><h2 class="rd-sec-h"><span class="ib">' + R.icon('book') + '</span>' + escapeHtml(t('continueReading')) + '</h2>' +
        '<div class="rcards">' + cards.join('') + '</div></section>';
    }

    function renderGlossary(list) {
      if (!Array.isArray(list) || !list.length) return '';
      const rows = list.filter(g => g && g.term).map(g =>
        '<div><dt>' + escapeHtml(g.term) + '</dt><dd>' + escapeHtml(g.definition || '') + '</dd></div>').join('');
      return rows ? '<div class="rd-card"><h3>' + escapeHtml(t('glossary')) + '</h3><dl class="rd-gloss">' + rows + '</dl></div>' : '';
    }

    // Contents list (main column) and the sticky "In this report" rail.
    // Free sections scroll to the preview; locked ones open the dialog.
    function tocAttrs(row, owns) {
      if (owns) return '';
      return row.locked === false ? ' data-preview' : ' data-locked="' + escapeHtml(row.name) + '"';
    }
    function renderContents(toc, owns) {
      if (!Array.isArray(toc) || !toc.length) return '';
      return '<div class="rd-card"><h3>' + escapeHtml(t('contents', toc.length)) + '</h3><ol class="rd-contents">' +
        toc.map(r => {
          const free = owns || r.locked === false;
          return '<li class="' + (free ? 'free' : '') + '"><span class="num">' + escapeHtml(r.num) + '</span>' +
            '<button type="button"' + tocAttrs(r, owns) + '>' + escapeHtml(r.name) + '</button>' +
            (free ? '<span style="font-size:12px;color:var(--muted-dim)">' + escapeHtml(r.pages || '') + '</span>' : R.icon('lock')) + '</li>';
        }).join('') + '</ol></div>';
    }
    function renderRail(toc, owns) {
      if (!Array.isArray(toc) || !toc.length) return '<aside class="rd-toc" hidden></aside>';
      return '<aside class="rd-toc" aria-label="' + escapeHtml(t('inThisReport')) + '"><h2>' + escapeHtml(t('inThisReport')) + '</h2><ol>' +
        toc.map(r => '<li><button type="button" class="' + ((owns || r.locked === false) ? 'free' : '') + '"' + tocAttrs(r, owns) + '>' +
          '<span class="num">' + escapeHtml(r.num) + '</span><span>' + escapeHtml(r.name) + '</span></button></li>').join('') +
        '</ol></aside>';
    }

    // Preview iframe: source HTML is 1280×720 per page, scaled to the column.
    function renderPreviewFrame(d, currentLocale) {
      const src = '/api/preview-html?slug=' + encodeURIComponent(d.slug) + '&locale=' + encodeURIComponent(currentLocale);
      const cta = PER_REPORT_PURCHASE
        ? '<button class="r-btn r-btn-primary" id="preview-buy-btn">$' + (d.price || 39) + '</button>'
        : '<a class="r-btn r-btn-primary" href="' + WAITLIST_URL + '">' + escapeHtml(t('requestAccess')) + R.icon('arrow') + '</a>';
      return '<section class="rd-sec rpt-preview-section" id="preview">' +
        '<h2 class="rd-sec-h"><span class="ib">' + R.icon('pages') + '</span>' + escapeHtml(t('previewTitle')) + '</h2>' +
        '<div class="rd-preview">' +
          '<div class="rd-preview-frame" data-w="' + PREVIEW_PAGE_W + '" data-h="' + (PREVIEW_PAGE_H * PREVIEW_PAGES) + '">' +
            '<iframe src="' + src + '" title="' + escapeHtml(t('previewTitle')) + '" loading="lazy" referrerpolicy="same-origin" width="' + PREVIEW_PAGE_W + '" height="' + (PREVIEW_PAGE_H * PREVIEW_PAGES) + '"></iframe>' +
          '</div>' +
          '<div class="rd-preview-bar"><span>' + escapeHtml(t('previewPages', PREVIEW_PAGES)) + (d.pages ? ' / ' + d.pages : '') + '</span>' + cta + '</div>' +
        '</div></section>';
    }
    function fitPreviewFrame() {
      document.querySelectorAll('.rd-preview-frame').forEach(wrap => {
        const iframe = wrap.querySelector('iframe');
        if (!iframe) return;
        const scale = wrap.clientWidth / (Number(wrap.dataset.w) || PREVIEW_PAGE_W);
        iframe.style.transform = 'scale(' + scale + ')';
        wrap.style.height = Math.round((Number(wrap.dataset.h) || PREVIEW_PAGE_H) * scale) + 'px';
      });
    }

    function renderLangLinks(slug, currentLocale, available) {
      const labels = { en: 'English', ja: '日本語', ko: '한국어', zh: '简体中文' };
      return '<div class="rd-langs">' + ['en', 'ja', 'ko', 'zh'].map(loc => {
        const ok = available.includes(loc);
        return '<a href="' + (ok ? '/' + loc + '/reports/' + encodeURIComponent(slug) : '#') + '" class="' + (loc === currentLocale ? 'on' : '') + (ok ? '' : ' off') + '"' +
          (ok ? '' : ' aria-disabled="true" title="' + escapeHtml(t('notAvailable')) + '"') + ' hreflang="' + (loc === 'zh' ? 'zh-Hans' : loc) + '">' + labels[loc] + '</a>';
      }).join('') + '</div>';
    }

    // Access box: owned copy → download; per-report sale on → price + buy;
    // otherwise the subscription waitlist (S5 default).
    function renderAccessBox(d, state) {
      const incl = '<ul class="rd-incl">' + ['incl1', 'incl2', 'incl3', 'incl4'].map(k => '<li>' + R.icon('check') + escapeHtml(t(k)) + '</li>').join('') + '</ul>';
      if (state.purchased) {
        return '<div class="rd-box rd-access"><h3>' + escapeHtml(t('owned')) + '</h3>' +
          (state.pdfUrl ? '<a class="r-btn r-btn-primary r-btn-block" href="' + escapeHtml(state.pdfUrl) + '" download>' + escapeHtml(t('downloadPdf')) + '</a>'
                        : '<p>' + escapeHtml(t('pdfPending')) + '</p>') + '</div>';
      }
      if (PER_REPORT_PURCHASE) {
        return '<div class="rd-box rd-access"><h3>' + escapeHtml(t('accessTitle')) + '</h3>' +
          '<p style="font-size:28px;font-weight:800;color:var(--text);margin:0 0 12px">$' + (d.price || 39) + '</p>' +
          (state.anyLocale ? '<p>' + escapeHtml(t('owned')) + ' (' + escapeHtml((state.ownedLocale || 'en').toUpperCase()) + ')</p>' : '') +
          '<button class="r-btn r-btn-primary r-btn-block" id="buy-btn">' + escapeHtml(t('accessTitle')) + R.icon('arrow') + '</button>' + incl + '</div>';
      }
      return '<div class="rd-box rd-access"><h3>' + escapeHtml(t('accessTitle')) + '</h3><p>' + escapeHtml(t('accessBody')) + '</p>' +
        (state.anyLocale ? '<p>' + escapeHtml(t('owned')) + ' (' + escapeHtml((state.ownedLocale || 'en').toUpperCase()) + ')</p>' : '') +
        '<a class="r-btn r-btn-primary r-btn-block" href="' + WAITLIST_URL + '">' + escapeHtml(t('requestAccess')) + R.icon('arrow') + '</a>' +
        '<p class="small">' + escapeHtml(t('nothingCharged')) + '</p>' + incl +
        '<p style="margin:14px 0 0"><a class="r-link" href="/' + locale + '/pricing">' + escapeHtml(t('seePlans')) + ' →</a></p></div>';
    }

    function renderFullBody(full) {
      if (!full) return '';
      if (typeof full === 'string') return '<section class="rd-sec rd-prose report-full-content">' + full + '</section>';
      const sections = Array.isArray(full.sections) ? full.sections : [];
      if (!sections.length) return '<section class="rd-sec rd-prose report-full-content"><p>' + escapeHtml(t('pdfPending')) + '</p></section>';
      // body_html is admin-trusted (writable only with the service key).
      return '<div class="rd-sec rd-prose report-full-content">' + sections.map(s =>
        '<section>' + (s.heading ? '<h2 class="rd-sec-h">' + escapeHtml(s.heading) + '</h2>' : '') + (s.body_html || '') + '</section>').join('') + '</div>';
    }

    // toc rows are {num, name, pages, locked} objects, or plain strings
    // ("Name — what it covers") in older reports; strings count as locked.
    function normToc(toc) {
      if (!Array.isArray(toc)) return [];
      return toc.map((r, i) => {
        if (r && typeof r === 'object') return { num: r.num || String(i + 1).padStart(2, '0'), name: r.name || '', pages: r.pages || '', locked: r.locked };
        const str = String(r || '');
        return { num: String(i + 1).padStart(2, '0'), name: str.split(/\s+—\s+/)[0], pages: '', locked: undefined };
      }).filter(r => r.name);
    }

    function render(d, purchaseState, fullContent, captureResult) {
      const owns = !!purchaseState.purchased;
      d.toc = normToc(d.toc);
      const crumbs = '<nav class="r-crumbs" aria-label="Breadcrumb">' +
        '<a href="/' + locale + '/library">' + escapeHtml(t('library')) + '</a>' +
        (d.country ? '<span class="sep">›</span><a href="/' + locale + '/library?country=' + encodeURIComponent(d.country.toLowerCase()) + '">' + escapeHtml(R.country(d.country)) + '</a>' : '') +
        (d.industry ? '<span class="sep">›</span><a href="/' + locale + '/library?industry=' + encodeURIComponent(d.industry.toLowerCase()) + '">' + escapeHtml(d.industry) + '</a>' : '') +
      '</nav>';
      const eyebrow = d.eyebrow || [R.country(d.country), d.industry].filter(Boolean).join(' · ');

      let banners = '';
      if (captureResult) {
        banners += captureResult.ok
          ? '<div class="rd-banner"><strong>Purchase complete.</strong> Your full report is unlocked below.</div>'
          : '<div class="rd-banner warn"><strong>We could not finalise your purchase.</strong> Please retry, or email hello@kiraresearch.com with your PayPal receipt.</div>';
      } else if (paypalReturn === 'cancel') {
        banners += '<div class="rd-banner warn">Checkout cancelled. Your card was not charged.</div>';
      }
      if (d.isFallback) banners += '<div class="rd-banner">' + escapeHtml(t('fallback')) + '</div>';

      // abstract (200-300 words, indexable) wins over lede + paragraphs.
      const lede = d.preview && d.preview.lede ? d.preview.lede : '';
      const prose = d.abstract
        ? '<p>' + escapeHtml(d.abstract) + '</p>'
        : (lede ? '<p><strong>' + escapeHtml(lede) + '</strong></p>' : '') +
          (Array.isArray(d.preview && d.preview.paragraphs) ? d.preview.paragraphs.map(p => '<p>' + escapeHtml(p) + '</p>').join('') : '');
      const dataBlock = renderChart(d.preview && d.preview.chart) + renderPreviewTables(d.preview_tables);
      const sectionsN = (d.toc && d.toc.length) || null;
      const fact = (icon, k, v) => v ? '<div class="rd-fact">' + R.icon(icon) + '<div><div class="k">' + escapeHtml(k) + '</div><div class="v">' + escapeHtml(v) + '</div></div></div>' : '';
      const continueHtml = renderContinue(d);

      const tabs = [['overview', 'tabOverview'], dataBlock ? ['data', 'tabFindings'] : null, owns ? null : ['preview', 'tabPreview'],
        (d.toc && d.toc.length) ? ['contents', 'tabContents'] : null, continueHtml ? ['related', 'tabRelated'] : null].filter(Boolean);

      const cover = d.cover
        ? '<div class="rd-cover"><img src="' + escapeHtml(d.cover.full) + '" alt="" width="1536" height="1024" decoding="async" fetchpriority="high"></div>'
        : '';
      const pageUrl = 'https://kiraresearch.com/' + locale + '/reports/' + encodeURIComponent(d.slug);

      root.innerHTML =
        '<div class="r-band"><div class="r-container" style="padding-block:14px 0">' + crumbs + '</div></div>' +
        '<div class="r-container"><div class="rd">' +
          renderRail(d.toc, owns) +
          '<article class="rd-main">' + banners +
            (d.cover ? '<div class="rd-mcover"><img src="' + escapeHtml(d.cover.wide) + '" alt="" width="800" height="500" decoding="async"></div>' : '') +
            '<div class="rd-eyebrow">' + escapeHtml(eyebrow) + '</div>' +
            '<h1>' + escapeHtml(d.title || d.slug) + '</h1>' +
            (lede && d.abstract ? '<p class="rd-lede">' + escapeHtml(lede) + '</p>' : '') +
            '<div class="rd-facts">' +
              fact('cal', t('published'), R.date(d.published_at)) +
              fact('pages', t('pages'), d.pages ? String(d.pages) : '') +
              fact('doc', t('format'), 'PDF') +
              fact('layers', t('sections'), sectionsN ? String(sectionsN) : '') +
              fact('clock', t('updated'), R.date(d.last_refresh, 'long')) +
              fact('user', t('analyst'), t('ourTeam')) +
            '</div>' +
            '<nav class="rd-tabs" aria-label="' + escapeHtml(t('inThisReport')) + '">' + tabs.map(([id, k], i) => '<a href="#' + id + '"' + (i ? '' : ' class="on"') + '>' + escapeHtml(t(k)) + '</a>').join('') + '</nav>' +
            '<section class="rd-sec" id="overview">' +
              '<h2 class="rd-sec-h"><span class="ib">' + R.icon('doc') + '</span>' + escapeHtml(t('execSummary')) + (owns ? '' : '<span class="rd-badge">' + escapeHtml(t('freeToRead')) + '</span>') + '</h2>' +
              (owns ? '' : '<p class="rd-note">' + escapeHtml(t('freeNote')) + '</p>') +
              '<div class="rd-prose">' + prose + '</div>' +
            '</section>' +
            (dataBlock ? '<section class="rd-sec" id="data"><h2 class="rd-sec-h"><span class="ib">' + R.icon('layers') + '</span>' + escapeHtml(t('tabFindings')) + '</h2>' + dataBlock + '</section>' : '') +
            (owns ? '' : renderPreviewFrame(d, locale)) +
            ((d.toc && d.toc.length) || (d.glossary_json && d.glossary_json.length)
              ? '<section class="rd-sec" id="contents">' + renderContents(d.toc, owns) + renderGlossary(d.glossary_json) + '</section>' : '') +
            (owns ? renderFullBody(fullContent && fullContent.full_content) : '') +
            '<div id="rpt-key-players-slot"></div>' +
            continueHtml +
          '</article>' +
          '<aside class="rd-aside">' + cover +
            renderAccessBox(d, { purchased: owns, anyLocale: purchaseState.anyLocale, ownedLocale: purchaseState.ownedLocale, pdfUrl: fullContent && fullContent.pdf_url }) +
            '<div class="rd-box"><h3>' + escapeHtml(t('reportDetails')) + '</h3><dl class="rd-dl">' +
              (d.published_at ? '<dt>' + escapeHtml(t('published')) + '</dt><dd>' + escapeHtml(R.date(d.published_at)) + '</dd>' : '') +
              (d.pages ? '<dt>' + escapeHtml(t('pages')) + '</dt><dd>' + d.pages + '</dd>' : '') +
              '<dt>' + escapeHtml(t('format')) + '</dt><dd>PDF</dd>' +
              (d.code ? '<dt>' + escapeHtml(t('reportCode')) + '</dt><dd>' + escapeHtml(d.code) + '</dd>' : '') +
              (d.stage ? '<dt>' + escapeHtml(t('stage')) + '</dt><dd>' + escapeHtml(t(d.stage)) + '</dd>' : '') +
            '</dl><h3 style="margin-top:16px">' + escapeHtml(t('language')) + '</h3>' + renderLangLinks(d.slug, locale, d.availableLocales || []) + '</div>' +
            '<div class="rd-box"><div class="rd-tags">' +
              (d.industry ? '<a href="/' + locale + '/library?industry=' + encodeURIComponent(d.industry.toLowerCase()) + '">' + escapeHtml(d.industry) + '</a>' : '') +
              (d.country ? '<a href="/' + locale + '/library?country=' + encodeURIComponent(d.country.toLowerCase()) + '">' + escapeHtml(R.country(d.country)) + '</a>' : '') +
            '</div></div>' +
            '<div class="rd-box"><h3>' + escapeHtml(t('share')) + '</h3><div class="rd-share">' +
              '<button type="button" id="rd-copy">' + R.icon('link') + escapeHtml(t('copyLink')) + '</button>' +
              '<a href="https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(pageUrl) + '" target="_blank" rel="noopener">LinkedIn</a>' +
              '<a href="https://x.com/intent/post?url=' + encodeURIComponent(pageUrl) + '" target="_blank" rel="noopener">X</a>' +
            '</div></div>' +
          '</aside>' +
        '</div></div>';

      const buyBtn = document.getElementById('buy-btn');
      if (buyBtn) buyBtn.addEventListener('click', () => { buyBtn.disabled = true; startCheckout(d.slug, locale); });
      const previewBuyBtn = document.getElementById('preview-buy-btn');
      if (previewBuyBtn) previewBuyBtn.addEventListener('click', () => { previewBuyBtn.disabled = true; startCheckout(d.slug, locale); });
      const copyBtn = document.getElementById('rd-copy');
      if (copyBtn) copyBtn.addEventListener('click', () => {
        const done = () => { copyBtn.lastChild.textContent = t('copied'); };
        (navigator.clipboard ? navigator.clipboard.writeText(pageUrl) : Promise.reject()).then(done, () => { prompt('', pageUrl); });
      });

      wireUnlockModal(d, purchaseState);
      wireTabs();
      fitPreviewFrame();
      window.addEventListener('resize', fitPreviewFrame);
    }

    // Tabs + rail highlight the section in view; rail clicks scroll.
    function wireTabs() {
      const tabs = [...document.querySelectorAll('.rd-tabs a')];
      const secs = tabs.map(a => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
      if (!('IntersectionObserver' in window) || !secs.length) return;
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          tabs.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id));
        });
      }, { rootMargin: '-140px 0px -60% 0px' });
      secs.forEach(s => io.observe(s));
    }

    function wireUnlockModal(d, purchaseState) {
      const modal = document.getElementById('unlock-modal');
      const closeBtn = document.getElementById('unlock-modal-close');
      const buyBtn = document.getElementById('unlock-modal-buy');
      const titleEl = document.getElementById('unlock-modal-title');
      const bodyEl = document.getElementById('unlock-modal-body');
      if (!modal || !closeBtn || !buyBtn || !titleEl || !bodyEl) return;
      document.getElementById('unlock-modal-eyebrow').textContent = t('lockedTitle');
      buyBtn.textContent = PER_REPORT_PURCHASE ? t('accessTitle') + ' — $' + (d.price || 39) : t('requestAccess');
      closeBtn.setAttribute('aria-label', t('close'));
      const foot = modal.querySelector('.unlock-modal-footnote');
      if (foot) foot.textContent = PER_REPORT_PURCHASE ? '' : t('nothingCharged');
      let opener = null;

      function openModal(name, el) {
        opener = el;
        titleEl.textContent = name || t('lockedTitle');
        bodyEl.textContent = t('lockedBody');
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        closeBtn.focus();
      }
      function closeModal() {
        modal.hidden = true;
        document.body.style.overflow = '';
        if (opener) opener.focus();
      }
      document.querySelectorAll('[data-locked]').forEach(el => el.addEventListener('click', () => openModal(el.dataset.locked, el)));
      document.querySelectorAll('[data-preview]').forEach(el => el.addEventListener('click', () => {
        const target = document.getElementById('preview');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }));
      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
      buyBtn.addEventListener('click', () => {
        if (purchaseState.purchased) { closeModal(); return; }
        if (!PER_REPORT_PURCHASE) { window.location.href = WAITLIST_URL; return; }
        buyBtn.disabled = true;
        startCheckout(d.slug, locale);
      });
    }
  </script>
</body>
</html>

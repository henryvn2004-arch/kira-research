<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waitlist — Admin · KIRA RESEARCH</title>
  <meta name="robots" content="noindex,nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="/css/kira.css" />

  <!-- Supabase JS (loaded for kiraAuth) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>

  <style>
    /* Admin-only styles — kept inline so kira.css stays public-facing. */
    .admin-wrap { padding: 60px 0 96px; }
    .admin-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .admin-head h1 {
      font-family: 'Satoshi', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.015em;
    }
    .admin-head .me {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .admin-head .me a { color: var(--primary); text-decoration: none; margin-left: 12px; }

    .admin-filters {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .admin-filters button {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.15s;
    }
    .admin-filters button:hover { color: var(--text); border-color: var(--border-strong); }
    .admin-filters button.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }
    .admin-filters .spacer { flex: 1; }
    .admin-filters .count {
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      font-size: 12px;
      align-self: center;
    }

    .leads-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .leads-table th, .leads-table td {
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .leads-table th {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .leads-table tbody tr { transition: background 0.1s; }
    .leads-table tbody tr:hover { background: var(--surface); }

    .lead-when { font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .lead-name { font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .lead-email { font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 11px; }
    .lead-company { color: var(--text); }
    .lead-role { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .lead-tier, .lead-deadline {
      display: inline-block;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .lead-brief {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      max-width: 380px;
      cursor: pointer;
    }
    .lead-brief.expanded { white-space: pre-wrap; }
    .lead-brief:not(.expanded) {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .lead-status select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 3px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    .lead-status select:focus { outline: none; border-color: var(--primary); }
    .lead-status .saved {
      display: inline-block;
      margin-left: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--primary);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .lead-status .saved.show { opacity: 1; }

    .admin-empty {
      padding: 96px 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .admin-gate {
      max-width: 480px;
      margin: 96px auto;
      padding: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
    }
    .admin-gate h1 {
      font-family: 'Satoshi', sans-serif;
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .admin-gate p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .admin-gate code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      color: var(--primary);
    }

    /* Waitlist-specific */
    .wl-counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 28px; }
    .wl-count { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
    .wl-count .k { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
    .wl-count .v { font-family: 'Satoshi', sans-serif; font-weight: 700; font-size: 24px; margin-top: 4px; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .lead-notes textarea {
      width: 100%; min-width: 180px; min-height: 38px; resize: vertical;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 3px; padding: 6px 8px; font-family: inherit; font-size: 12px;
    }
    @media (max-width: 720px) {
      .wl-counts { grid-template-columns: repeat(2, 1fr); }
      .leads-table thead { display: none; }
      .leads-table, .leads-table tbody, .leads-table tr, .leads-table td { display: block; width: 100%; }
      .leads-table tr { border-bottom: 1px solid var(--border); padding: 10px 0; }
      .leads-table td { border-bottom: none; padding: 6px 4px; }
    }
  </style>
</head>
<body>

  <!-- nav + footer injected by /js/nav.js -->

  <div class="container admin-wrap" id="admin-wrap">

    <!-- Admin sub-nav (shared chrome) -->
    <nav class="admin-sub-nav">
      <span class="label">ADMIN</span>
      <a href="/en/admin/">Dashboard</a>
      <a href="/en/admin/leads">Leads</a>
      <a href="/en/admin/waitlist" class="active">Waitlist</a>
      <a href="/en/admin/reports">Reports</a>
      <a href="/en/admin/insights">Insights</a>
      <a href="/en/admin/transactions">Transactions</a>
      <a href="/en/admin/users">Users</a>
      <a href="/en/admin/aggregators">Aggregators</a>
      <a href="/en/admin/companies">Companies</a>
      <a href="/en/admin/topics">Topics</a>
      <a href="/en/admin/audit">Audit</a>
      <span class="spacer"></span>
      <span class="me" id="admin-me"></span>
    </nav>

    <div class="admin-head">
      <div>
        <h1>Subscription waitlist</h1>
        <p style="color:var(--muted);font-size:13px;margin-top:6px;">Sign-ups from the /pricing waitlist form. Nothing has been charged.</p>
      </div>
    </div>

    <div class="wl-counts" id="wl-counts"></div>

    <div class="admin-filters" id="admin-filters">
      <button data-status=""          class="active">All</button>
      <button data-status="new">New</button>
      <button data-status="contacted">Contacted</button>
      <button data-status="converted">Converted</button>
      <button data-status="spam">Spam</button>
      <div class="spacer"></div>
      <span class="count" id="admin-count"></span>
    </div>

    <div id="admin-content">
      <div class="admin-empty">Loading…</div>
    </div>
  </div>

  <script src="/js/nav.js" defer></script>

  <script type="module">
    async function ready() {
      while (!window.kiraAuth) await new Promise(r => setTimeout(r, 30));
    }
    await ready();

    const wrap     = document.getElementById('admin-content');
    const countEl  = document.getElementById('admin-count');
    const countsEl = document.getElementById('wl-counts');
    const meEl     = document.getElementById('admin-me');
    const filters  = document.getElementById('admin-filters');
    const STATUSES = ['new', 'contacted', 'converted', 'spam'];
    const PLAN_LABEL = { report: 'Single report', week: 'Week (legacy)', month: 'Month', annual: 'Annual', 'not-sure': 'Not sure' };
    let currentStatus = '';
    let session = null;

    const esc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    // 1) Require auth.
    const user = await window.kiraAuth.getUser();
    if (!user) {
      sessionStorage.setItem('kira_redirect_after_login', window.location.pathname);
      window.location.href = '/auth.html';
    }
    session = (await window.db.auth.getSession()).data.session;
    meEl.innerHTML = esc(user.email) + ' · <a href="#" id="signout-link">sign out</a>';
    document.getElementById('signout-link').addEventListener('click', (e) => {
      e.preventDefault();
      window.kiraAuth.signOut();
    });

    function gate(title, html) {
      wrap.innerHTML = `<div class="admin-gate"><h1>${title}</h1><p>${html}</p></div>`;
    }

    // 2) Fetch entries via secure API.
    async function fetchEntries() {
      wrap.innerHTML = '<div class="admin-empty">Loading…</div>';
      const qs = currentStatus ? `?status=${currentStatus}` : '';
      const r = await fetch('/api/admin-waitlist' + qs, {
        headers: { 'Authorization': 'Bearer ' + session.access_token }
      });
      if (r.status === 401) return gate('Session expired', 'Please <a href="/auth.html" style="color:var(--primary)">sign in</a> again.');
      if (r.status === 403) return gate('Not an admin', `Your email <code>${esc(user.email)}</code> is not on the admin allowlist (<code>ADMIN_EMAILS</code>).`);
      if (r.status === 500) {
        const body = await r.json().catch(() => ({}));
        if (body.error === 'admin_not_configured') return gate('Admin not configured', 'The server has no <code>ADMIN_EMAILS</code> set.');
      }
      if (!r.ok) { wrap.innerHTML = `<div class="admin-empty">Failed to load (${r.status}).</div>`; return; }
      const { entries, counts } = await r.json();
      renderCounts(counts || {});
      renderEntries(entries || []);
    }

    function renderCounts(c) {
      const bp = c.byPlan || {};
      const cells = [['Total', c.total || 0]].concat(
        ['report', 'week', 'month', 'annual', 'not-sure'].map(p => [PLAN_LABEL[p], bp[p] || 0])
      );
      countsEl.innerHTML = cells.map(([k, v]) =>
        `<div class="wl-count"><div class="k">${esc(k)}</div><div class="v">${Number(v)}</div></div>`
      ).join('');
    }

    function renderEntries(entries) {
      countEl.textContent = entries.length + (currentStatus ? ` ${currentStatus.toUpperCase()}` : '') + ' · MAX 500';
      if (!entries.length) {
        wrap.innerHTML = '<div class="admin-empty">No sign-ups yet.</div>';
        return;
      }
      const rows = entries.map(e => {
        const when = new Date(e.created_at).toLocaleString('en-GB', {
          year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit'
        });
        return `
          <tr data-id="${esc(e.id)}">
            <td class="lead-when">${when}<div style="margin-top:6px;"><span class="lead-tier">${esc(PLAN_LABEL[e.plan] || e.plan)}</span></div></td>
            <td>
              <div class="lead-name">${esc(e.name || '—')}</div>
              <div class="lead-email">${esc(e.email)}</div>
            </td>
            <td>
              <div class="lead-company">${esc(e.company || '—')}</div>
              <div class="lead-role">${esc(e.role || '')}</div>
            </td>
            <td><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);">${esc((e.locale || 'en').toUpperCase())} · ${esc(e.source || '')}</div></td>
            <td class="lead-notes"><textarea data-id="${esc(e.id)}" placeholder="Notes" aria-label="Notes">${esc(e.notes || '')}</textarea></td>
            <td class="lead-status">
              <select data-id="${esc(e.id)}" aria-label="Status">
                ${STATUSES.map(s => `<option value="${s}"${s === e.status ? ' selected' : ''}>${s}</option>`).join('')}
              </select>
              <span class="saved">SAVED</span>
            </td>
          </tr>`;
      }).join('');

      wrap.innerHTML = `
        <div class="table-scroll">
        <table class="leads-table">
          <thead><tr>
            <th>When · Plan</th>
            <th>Contact</th>
            <th>Company · Role</th>
            <th>Origin</th>
            <th>Notes</th>
            <th>Status</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>`;

      async function patch(id, body, savedSpan) {
        const r = await fetch('/api/admin-waitlist?id=' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
          body: JSON.stringify(body)
        });
        if (r.ok) {
          savedSpan.classList.add('show');
          setTimeout(() => savedSpan.classList.remove('show'), 1400);
        } else {
          alert('Update failed (' + r.status + ')');
        }
      }

      wrap.querySelectorAll('.lead-status select').forEach(sel => {
        sel.addEventListener('change', async () => {
          sel.disabled = true;
          try { await patch(sel.dataset.id, { status: sel.value }, sel.parentElement.querySelector('.saved')); }
          finally { sel.disabled = false; }
        });
      });
      wrap.querySelectorAll('.lead-notes textarea').forEach(ta => {
        let last = ta.value;
        ta.addEventListener('blur', async () => {
          if (ta.value === last) return;
          last = ta.value;
          const saved = ta.closest('tr').querySelector('.lead-status .saved');
          await patch(ta.dataset.id, { notes: ta.value }, saved);
        });
      });
    }

    // 3) Filter chip wiring.
    filters.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        filters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStatus = btn.dataset.status;
        fetchEntries();
      });
    });

    fetchEntries();
  </script>
</body>
</html>

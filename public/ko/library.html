<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>리서치 라이브러리 — KIRA RESEARCH</title>
  <meta name="description" content="동남아시아, 호주, 뉴질랜드, 대만의 시장·산업·진출 경로에 관한 리서치. 핵심 요약은 무료로 열람할 수 있습니다." />

  <!-- hreflang -->
  <link rel="alternate" hreflang="en" href="https://kiraresearch.com/en/library" />
  <link rel="alternate" hreflang="ja" href="https://kiraresearch.com/ja/library" />
  <link rel="alternate" hreflang="ko" href="https://kiraresearch.com/ko/library" />
  <link rel="alternate" hreflang="zh-Hans" href="https://kiraresearch.com/zh/library" />
  <link rel="alternate" hreflang="x-default" href="https://kiraresearch.com/en/library" />
  <link rel="canonical" href="https://kiraresearch.com/ko/library" />

  <!-- Open Graph -->
  <meta property="og:title" content="리서치 라이브러리 — KIRA RESEARCH" />
  <meta property="og:description" content="당사가 다루는 모든 시장을, 하나의 라이브러리에. 핵심 요약은 무료로 열람할 수 있습니다." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kiraresearch.com/ko/library" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />

  <link rel="stylesheet" href="/css/kira.css" />

  <style>
    /* ko: Hangul font fallback; keep Korean words intact when wrapping */
    body, h1, h2, h3, h4, h5 { font-family: 'Satoshi', 'Noto Sans KR', sans-serif; }
    body { word-break: keep-all; overflow-wrap: break-word; }
    .nav-wrap, .locale-switcher { word-break: normal; }
    .lib-empty {
      grid-column: 1 / -1;
      padding: 96px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .lib-empty a { color: var(--primary); }
    .filter-option.is-empty { color: var(--muted-dim); }
    .filter-option .soon {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--muted-dim);
      margin-left: 6px;
      text-transform: uppercase;
    }
    .filter-clear {
      display: inline-block;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      margin-bottom: 24px;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      font-family: inherit;
    }
    .lib-tagline {
      margin-top: 14px;
      font-size: 14px;
      color: var(--muted);
    }
    .lib-tagline a { color: var(--primary); text-decoration: none; }
    .report-card .rc-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .report-card .rc-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
    }
    @media (max-width: 960px) {
      .filters .filter-opts { display: flex; flex-wrap: wrap; gap: 8px; }
      .filters .filter-option {
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 100px;
        gap: 8px;
        font-size: 13px;
      }
      .filters .filter-option.active { border-color: var(--primary); }
    }
  </style>
</head>
<body>

  <!-- nav + footer injected by /js/nav.js -->

  <div class="container">
    <header class="lib-header">
      <div class="hero-eyebrow" data-i18n="library.eyebrow">리서치 라이브러리</div>
      <h1 data-i18n="library.title">당사가 다루는 모든 시장을, 하나의 라이브러리에.</h1>
      <p data-i18n="library.sub">시장, 산업, 의사결정 단계별로 검색할 수 있습니다. 핵심 요약은 무료로 열람할 수 있으며, 전체 보고서는 구독에 포함됩니다.</p>
      <p class="lib-tagline"><span data-i18n="library.waitlistNote">구독은 곧 시작됩니다.</span> <a href="/ko/pricing#waitlist" data-i18n="library.waitlistLink">조기 이용 신청 →</a></p>
    </header>

    <div class="lib-controls">
      <input type="text" class="lib-search" id="lib-search"
             placeholder="시장, 산업 또는 보고서 코드로 검색 (예: VN-FSV)…"
             aria-label="보고서 검색"
             data-i18n-attr="placeholder:library.searchPlaceholder;aria-label:library.searchAria" />
      <span class="lib-count" id="lib-count" aria-live="polite"></span>
    </div>

    <div class="lib-grid">
      <!-- Facets are built from /api/library-list (facets + live counts).
           data-facets="dynamic" tells live-counts.js to leave this sidebar alone. -->
      <aside class="filters" data-facets="dynamic" id="lib-filters">
        <button type="button" class="filter-clear" id="lib-clear" hidden data-i18n="library.clearFilters">필터 모두 해제</button>

        <div class="filter-group" data-group="stage">
          <h2 data-i18n="library.filterStage">단계</h2>
          <div class="filter-opts"></div>
        </div>
        <div class="filter-group" data-group="type">
          <h2 data-i18n="library.filterType">보고서 유형</h2>
          <div class="filter-opts"></div>
        </div>
        <div class="filter-group" data-group="country">
          <h2 data-i18n="library.filterCountry">시장</h2>
          <div class="filter-opts"></div>
        </div>
        <div class="filter-group" data-group="industry">
          <h2 data-i18n="library.filterIndustry">산업</h2>
          <div class="filter-opts"></div>
        </div>
        <div class="filter-group" data-group="year">
          <h2 data-i18n="library.filterYear">연도</h2>
          <div class="filter-opts"></div>
        </div>
      </aside>

      <div class="lib-results" id="lib-results">
        <div class="lib-empty" data-i18n="library.loading">라이브러리를 불러오는 중…</div>
      </div>
    </div>
  </div>

  <script src="/js/nav.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/live-counts.js" defer></script>
  <script defer>
    // ── Library page: facets + dynamic fetch (Sprint S5) ─────
    // Filters: stage (XPL/ENT/XPN), type (D/S), country, industry, year, q.
    // All filtering is server-side via /api/library-list; facet counts come
    // from the same response (`facets`, counted over all published reports).
    document.addEventListener('DOMContentLoaded', () => {
      const root     = document.getElementById('lib-results');
      const countEl  = document.getElementById('lib-count');
      const searchEl = document.getElementById('lib-search');
      const clearEl  = document.getElementById('lib-clear');
      const filtersEl = document.getElementById('lib-filters');
      const locale   = (window.kira && window.kira.locale) || 'ko';

      // Fixed vocabularies (match living_reports.stage / report_type, migration 023).
      const STAGES = [
        { value: 'XPL', label: '평가' },
        { value: 'ENT', label: '진출' },
        { value: 'XPN', label: '확장' }
      ];
      const TYPES = [
        { value: 'D', label: '심층 보고서' },
        { value: 'S', label: '스냅샷' }
      ];
      const STAGE_LABEL = Object.fromEntries(STAGES.map(s => [s.value, s.label]));
      const TYPE_LABEL  = Object.fromEntries(TYPES.map(t => [t.value, t.label]));
      // ko: display names for the market facet + card meta (filter values stay as stored).
      const COUNTRY_KO = {
        vietnam: '베트남', thailand: '태국', indonesia: '인도네시아', malaysia: '말레이시아',
        singapore: '싱가포르', philippines: '필리핀', cambodia: '캄보디아', laos: '라오스',
        myanmar: '미얀마', brunei: '브루나이', australia: '호주', 'new zealand': '뉴질랜드', taiwan: '대만'
      };

      const state = { stage: '', type: '', country: '', industry: '', year: '', q: '' };
      let facets = null;

      // ── Initial state from URL (?stage=ENT&country=vietnam…) ──
      const init = new URLSearchParams(window.location.search);
      const stageIn = (init.get('stage') || '').toUpperCase();
      const typeIn  = (init.get('type')  || '').toUpperCase();
      if (STAGE_LABEL[stageIn]) state.stage = stageIn;
      if (TYPE_LABEL[typeIn])   state.type  = typeIn;
      ['country', 'industry'].forEach(k => { const v = init.get(k); if (v) state[k] = v.toLowerCase(); });
      if (/^\d{4}$/.test(init.get('year') || '')) state.year = init.get('year');
      if (init.get('q')) { state.q = init.get('q').slice(0, 60); if (searchEl) searchEl.value = state.q; }

      function syncUrl() {
        const u = new URL(window.location.href);
        ['stage', 'type', 'country', 'industry', 'year', 'q'].forEach(k => {
          if (state[k]) u.searchParams.set(k, state[k]); else u.searchParams.delete(k);
        });
        u.searchParams.delete('filter');
        u.searchParams.delete('sort');
        history.replaceState(null, '', u.pathname + (u.search || ''));
      }

      // ── Facet sidebar ──
      function titleCase(s) {
        return String(s || '').replace(/\b\w/g, c => c.toUpperCase());
      }
      function optHtml(group, value, label, n, extra) {
        const active = state[group] === value;
        const cls = 'filter-option' + (active ? ' active' : '') + (n === 0 ? ' is-empty' : '');
        return '<div class="' + cls + '" role="button" tabindex="0" aria-pressed="' + active + '"' +
               ' data-filter="' + group + '" data-value="' + escapeHtml(value) + '">' +
                 '<span>' + escapeHtml(label) + (extra || '') + '</span>' +
                 '<span class="count">' + (n == null ? '' : n) + '</span>' +
               '</div>';
      }
      function renderFacets() {
        const f = facets || {};
        const total = f.totalPublished != null ? f.totalPublished : '';
        const groups = {
          stage: STAGES.map(s => ({ value: s.value, label: s.label, n: (f.stages || {})[s.value] || 0, keep: true })),
          type:  TYPES.map(t => {
            const n = (f.types || {})[t.value] || 0;
            return { value: t.value, label: t.label, n, keep: true,
                     extra: (t.value === 'S' && n === 0) ? '<span class="soon">준비 중</span>' : '' };
          }),
          country:  Object.entries(f.countries  || {}).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
                      .map(([k, n]) => ({ value: k, label: COUNTRY_KO[k] || titleCase(k), n })),
          industry: Object.entries(f.industries || {}).sort((a, b) => a[0].localeCompare(b[0]))
                      .map(([k, n]) => ({ value: k, label: titleCase(k), n })),
          year:     Object.entries(f.years      || {}).sort((a, b) => b[0].localeCompare(a[0]))
                      .map(([k, n]) => ({ value: String(k), label: String(k), n }))
        };
        Object.entries(groups).forEach(([group, opts]) => {
          const box = filtersEl.querySelector('[data-group="' + group + '"] .filter-opts');
          if (!box) return;
          // Keep a URL-selected value visible even if it has no published reports.
          if (state[group] && !opts.some(o => o.value === state[group])) {
            opts.push({ value: state[group], label: STAGE_LABEL[state[group]] || TYPE_LABEL[state[group]] || titleCase(state[group]), n: 0 });
          }
          box.innerHTML =
            optHtml(group, '', '전체', group === 'stage' || group === 'type' || group === 'country' ? total : null) +
            opts.filter(o => o.keep || o.n > 0 || state[group] === o.value)
                .map(o => optHtml(group, o.value, o.label, o.n, o.extra)).join('');
          // Hide a whole group when there is nothing to choose from.
          box.parentElement.style.display = (opts.length || state[group]) ? '' : 'none';
        });
        // "All" rows are active when nothing is selected in that group.
        filtersEl.querySelectorAll('.filter-option[data-value=""]').forEach(el => {
          const g = el.dataset.filter;
          el.classList.toggle('active', !state[g]);
          el.setAttribute('aria-pressed', String(!state[g]));
        });
        clearEl.hidden = !['stage', 'type', 'country', 'industry', 'year', 'q'].some(k => state[k]);
      }

      // Event delegation — options are re-rendered on every fetch.
      function choose(el) {
        const group = el.dataset.filter;
        // Only known filter groups may be written (the attribute comes from the DOM).
        if (!['stage', 'type', 'country', 'industry', 'year'].includes(group)) return;
        const value = el.dataset.value || '';
        state[group] = (state[group] === value) ? '' : value;
        fetchAndRender();
      }
      filtersEl.addEventListener('click', e => {
        const el = e.target.closest('.filter-option');
        if (el) choose(el);
      });
      filtersEl.addEventListener('keydown', e => {
        const el = e.target.closest('.filter-option');
        if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); choose(el); }
      });
      clearEl.addEventListener('click', () => {
        state.stage = state.type = state.country = state.industry = state.year = state.q = '';
        if (searchEl) searchEl.value = '';
        fetchAndRender();
      });

      // ── Search (server-side q=: report code prefix, or words in slug / segment / industry / country) ──
      let searchTimer = null;
      if (searchEl) {
        searchEl.addEventListener('input', () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            state.q = searchEl.value.trim().slice(0, 60);
            fetchAndRender();
          }, 250);
        });
      }

      // ── Fetch + render ──
      let seq = 0;
      async function fetchAndRender() {
        const mySeq = ++seq;
        syncUrl();
        root.innerHTML = '<div class="lib-empty">불러오는 중…</div>';
        const qs = new URLSearchParams();
        qs.set('locale', locale);
        qs.set('sort', 'recent');
        qs.set('limit', '96');
        ['stage', 'type', 'country', 'industry', 'year', 'q'].forEach(k => { if (state[k]) qs.set(k, state[k]); });

        try {
          const r = await fetch('/api/library-list?' + qs.toString());
          if (!r.ok) throw new Error('http ' + r.status);
          const data = await r.json();
          if (mySeq !== seq) return;          // a newer request is in flight
          facets = data.facets || facets;
          renderFacets();
          render(data);
        } catch (err) {
          if (mySeq !== seq) return;
          renderFacets();
          root.innerHTML = '<div class="lib-empty">라이브러리를 불러올 수 없습니다. 다시 시도해 주십시오.</div>';
        }
      }

      function render(data) {
        const items = data.items || [];
        const total = data.total || 0;
        if (countEl) {
          countEl.textContent = '보고서 ' + total + '건';
        }
        if (!items.length) {
          root.innerHTML = '<div class="lib-empty">조건에 맞는 보고서가 아직 없습니다. <a href="/ko/library">필터 해제 →</a></div>';
          return;
        }
        root.innerHTML = items.map(it => {
          const country  = COUNTRY_KO[(it.country || '').toLowerCase()] || (it.country  || '').toUpperCase();
          const industry = (it.industry || '').toUpperCase();
          const meta     = [industry, it.year].filter(Boolean).join(' · ');
          const title    = it.title || humanize(it.slug);
          const excerpt  = it.excerpt || '';
          const tags = [STAGE_LABEL[it.stage], TYPE_LABEL[it.type]].filter(Boolean)
            .map(t => '<span class="rc-tag">' + escapeHtml(t) + '</span>').join('');
          return (
            '<a href="/' + locale + '/reports/' + escapeAttr(it.slug) + '" class="report-card">' +
              '<div class="report-meta">' +
                '<span class="country">' + escapeHtml(country) + '</span>' +
                '<span>' + escapeHtml(meta) + '</span>' +
              '</div>' +
              (tags ? '<div class="rc-tags">' + tags + '</div>' : '') +
              '<h3>' + escapeHtml(title) + '</h3>' +
              (excerpt ? '<p class="report-desc">' + escapeHtml(excerpt.slice(0, 180)) + (excerpt.length > 180 ? '…' : '') + '</p>' : '') +
              '<div class="report-footer">' +
                '<span class="report-price">요약 무료</span>' +
                '<span class="report-cta">요약 보기 →</span>' +
              '</div>' +
            '</a>'
          );
        }).join('');
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function escapeAttr(s) { return encodeURIComponent(String(s == null ? '' : s)); }
      function humanize(slug) {
        return String(slug || '')
          .replace(/-/g, ' ')
          .replace(/\b\w/g, c => c.toUpperCase());
      }

      renderFacets();
      fetchAndRender();
    });
  </script>
</body>
</html>
